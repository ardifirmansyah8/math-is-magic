<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A chalkboard adventure where every spell is a math puzzle. Dress your mage, collect power-ups and beat ten monsters.">
<meta name="theme-color" content="#4a2c17">
<meta property="og:title" content="Math Is Magic">
<meta property="og:description" content="A chalkboard adventure where every spell is a math puzzle.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%231e3a30%22%2F%3E%3Cpath%20d%3D%22M32%208l6.5%2015.6%2016.9%201.4-12.9%2011%204%2016.5L32%2043.6%2017.5%2052.5l4-16.5-12.9-11%2016.9-1.4z%22%20fill%3D%22%23f5d561%22%20stroke%3D%22%23f3efe4%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Math Is Magic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredericka+the+Great&family=Kalam:wght@400;700&display=swap">
<style>
:root {
  /* Layout: a wood-framed chalkboard fills the screen. Everything on it is drawn in chalk; one screen shows at a time and scrolls inside the board. */
  --slate: #1e3a30;
  --slate-hi: #28493d;
  --slate-lo: #15291f;
  --chalk: #f3efe4;
  --chalk-dim: #a9bcb1;
  --yellow: #f5d561;
  --pink: #f39ac0;
  --blue: #8fd0f0;
  --mint: #9fe0b4;
  --lilac: #c3a6f0;
  --coral: #ff9a7f;
  --sand: #e8c98a;
  --wood: #7a4b2a;
  --wood-dark: #4a2c17;
  --wood-light: #b07a4a;
  --ink: #2a2320;
  --font-display: "Fredericka the Great", "Rockwell", Georgia, serif;
  --font-body: "Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Kalam", "Chalkboard SE", "Comic Sans MS", cursive;
  --wobble: 16px 20px 14px 22px / 20px 14px 22px 16px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; background: var(--wood-dark); }
body {
  height: 100%; margin: 0;
  background: var(--wood-dark); color: var(--chalk);
  font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
.sprites { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- Frame and board ---------- */
.app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-block: 12px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    repeating-linear-gradient(92deg, rgba(0, 0, 0, .07) 0 2px, transparent 2px 11px),
    linear-gradient(180deg, var(--wood-light), var(--wood) 40%, var(--wood-dark));
}
.board {
  position: relative; flex: 1; min-height: 0;
  background: var(--slate);
  border-radius: 6px;
  box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .28), inset 0 0 70px rgba(0, 0, 0, .5), 0 1px 0 rgba(255, 255, 255, .18);
  overflow: hidden;
}
.board::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 40% 25% at 18% 28%, rgba(243, 239, 228, .07), transparent 70%),
    radial-gradient(ellipse 35% 22% at 78% 72%, rgba(243, 239, 228, .06), transparent 70%),
    radial-gradient(ellipse 50% 12% at 55% 12%, rgba(243, 239, 228, .045), transparent 70%);
}
.ledge {
  position: relative; flex: none; height: 18px; margin-inline: -6px;
  background: linear-gradient(180deg, var(--wood-light), var(--wood) 60%, var(--wood-dark));
  border-radius: 3px 3px 0 0;
  box-shadow: 0 -4px 8px rgba(0, 0, 0, .35);
  margin-bottom: env(safe-area-inset-bottom, 0px);
}
.ledge::before, .ledge::after {
  content: ""; position: absolute; top: -5px; height: 8px; border-radius: 4px;
}
.ledge::before { left: 18%; width: 46px; background: var(--chalk); transform: rotate(-3deg); }
.ledge::after { left: 26%; width: 30px; background: var(--pink); transform: rotate(4deg); }

.screen {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px 24px;
}
.wrap { width: 100%; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
.wrap-narrow { max-width: 640px; }

/* ---------- Type ---------- */
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
.display { font-family: var(--font-display); letter-spacing: .01em; text-shadow: 0 0 1px rgba(243, 239, 228, .5), 0 0 22px rgba(243, 239, 228, .1); }
.h2 { font-family: var(--font-display); font-size: clamp(28px, 6vw, 38px); line-height: 1.1; }
.h3 { font-family: var(--font-display); font-size: 24px; line-height: 1.15; }
.hand { font-family: var(--font-hand); color: var(--yellow); font-size: 19px; line-height: 1.35; }
.dim { color: var(--chalk-dim); }
.eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-dim); font-weight: 700; }
p { margin: 0; }

/* ---------- Buttons ---------- */
button { font: inherit; color: inherit; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 50px; padding: 10px 22px;
  border: 2.5px solid var(--chalk); border-radius: var(--wobble);
  background: rgba(243, 239, 228, .04);
  color: var(--chalk); font-family: var(--font-body); font-weight: 700; font-size: 18px;
  cursor: pointer; text-decoration: none;
  transition: background .15s, transform .08s;
  touch-action: manipulation;
}
.btn:hover { background: rgba(243, 239, 228, .1); }
.btn:active { transform: translateY(2px); }
.btn-primary { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.btn-primary:hover { background: #f8df80; }
.btn-small { min-height: 40px; padding: 6px 14px; font-size: 15px; }
.btn-ghost { border-color: transparent; background: none; color: var(--chalk-dim); text-decoration: underline; text-underline-offset: 4px; }
.btn-ghost:hover { background: rgba(243, 239, 228, .06); color: var(--chalk); }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }
.icon-btn {
  width: 44px; height: 44px; flex: none;
  display: inline-grid; place-items: center;
  border: 2px solid rgba(243, 239, 228, .5); border-radius: 50%;
  background: none; cursor: pointer; padding: 0;
}
.icon-btn:hover { background: rgba(243, 239, 228, .1); }
.icon-btn .ico { width: 24px; height: 24px; }
:focus-visible { outline: 3px dashed var(--yellow); outline-offset: 3px; }
.ico { width: 28px; height: 28px; display: inline-block; vertical-align: middle; flex: none; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* ---------- Title ---------- */
.title-screen .wrap { justify-content: center; align-items: center; text-align: center; gap: 14px; position: relative; }
.scribbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.scribbles span { position: absolute; font-family: var(--font-hand); color: var(--chalk); opacity: .16; font-size: 20px; white-space: nowrap; }
.title-top { position: absolute; top: 0; right: 0; }
.title-word { font-size: clamp(46px, 13vw, 96px); line-height: .95; }
.title-word em { font-style: normal; color: var(--yellow); }
.title-art { display: flex; align-items: flex-end; justify-content: center; gap: 4px; margin-top: 4px; }
.title-art .mage { width: min(46vw, 210px); height: auto; }
.title-art .monster { width: min(30vw, 150px); height: auto; opacity: .55; transform: scaleX(1); }
.title-actions { display: flex; flex-direction: column; gap: 10px; width: min(100%, 320px); }
.confirm { display: grid; gap: 10px; padding: 14px; border: 2px dashed var(--coral); border-radius: var(--wobble); }

/* ---------- Wardrobe ---------- */
.ward { display: grid; gap: 18px; }
.ward-preview { display: grid; place-items: center; }
.ward-preview .mage { width: min(52vw, 230px); height: auto; }
.ward-opts { display: grid; gap: 16px; min-width: 0; }
.opt { display: grid; gap: 8px; }
.opt-label { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--chalk-dim); font-weight: 700; }
.name-input {
  width: 100%; max-width: 360px;
  font: 700 24px var(--font-body); color: var(--chalk);
  background: transparent; border: 0; border-bottom: 3px solid var(--chalk);
  padding: 6px 2px; border-radius: 0;
}
.name-input:focus { outline: none; border-bottom-color: var(--yellow); }
.name-input::placeholder { color: var(--chalk-dim); font-weight: 400; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch {
  width: 42px; height: 42px; border-radius: 50%;
  border: 3px solid rgba(243, 239, 228, .35); cursor: pointer; padding: 0;
}
.swatch[aria-pressed="true"] { border-color: var(--chalk); box-shadow: 0 0 0 3px var(--slate), 0 0 0 6px var(--yellow); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  min-height: 42px; padding: 6px 16px;
  border: 2px solid rgba(243, 239, 228, .45); border-radius: var(--wobble);
  background: none; cursor: pointer; font-weight: 700;
}
.pill[aria-pressed="true"] { border-color: var(--yellow); background: rgba(245, 213, 97, .16); color: var(--yellow); }
@media (min-width: 760px) {
  .ward { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); align-items: center; }
  .ward-preview .mage { width: min(32vw, 300px); }
}

/* ---------- Map ---------- */
.topbar { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.topbar .grow { flex: 1; min-width: 0; }
.star-count { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.stops { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; position: relative; }
.stops::before {
  content: ""; position: absolute; left: 27px; top: 28px; bottom: 28px;
  border-left: 3px dashed rgba(243, 239, 228, .3);
}
.stop {
  position: relative;
  display: grid; grid-template-columns: 56px 70px minmax(0, 1fr); gap: 12px; align-items: center;
}
.stop-num {
  width: 56px; height: 56px; border-radius: 50%;
  display: grid; place-items: center;
  font: 400 28px var(--font-display);
  background: var(--slate); border: 3px solid var(--chalk);
  z-index: 1;
}
.stop.done .stop-num { background: var(--mint); color: var(--ink); border-color: var(--mint); }
.stop.locked .stop-num { border-style: dashed; color: var(--chalk-dim); border-color: var(--chalk-dim); }
.stop .monster { width: 70px; height: 70px; }
.stop.locked .monster { opacity: .3; filter: grayscale(1); }
.stop-info { display: grid; gap: 4px; min-width: 0; }
.stop-info .h3 { font-size: 22px; }
.stop-meta { color: var(--chalk-dim); font-size: 15px; }
.stop-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 4px; }
.rate { display: inline-flex; gap: 2px; }
.rate .ico { width: 22px; height: 22px; }
.locked-note { display: inline-flex; align-items: center; gap: 6px; color: var(--chalk-dim); font-size: 15px; }
.locked-note .ico { width: 20px; height: 20px; }
.story { padding: 12px 14px; border-left: 3px solid var(--yellow); background: rgba(0, 0, 0, .12); border-radius: 0 10px 10px 0; }
.map-foot { margin-top: auto; padding-top: 6px; }

/* ---------- Intro card ---------- */
.intro { display: grid; gap: 14px; justify-items: center; text-align: center; margin: auto 0; }
.intro .monster { width: min(56vw, 240px); height: auto; }
.rules { display: grid; gap: 8px; text-align: left; max-width: 34em; margin: 0; padding: 0; list-style: none; }
.rules li { display: flex; gap: 10px; align-items: flex-start; }
.rules .ico { width: 26px; height: 26px; margin-top: 1px; }

/* ---------- Battle ---------- */
.battle .wrap { gap: 12px; }
.hearts { display: inline-flex; gap: 2px; min-height: 26px; align-items: center; }
.hearts .ico { width: 26px; height: 26px; }
.realm-name { font-family: var(--font-display); font-size: 22px; line-height: 1.15; }
.battle-body { display: grid; gap: 14px; }
.arena {
  position: relative;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: end; gap: 8px;
  padding: 4px 0 0;
}
.fighter { display: grid; justify-items: center; gap: 4px; min-width: 0; position: relative; }
.arena .mage { width: min(30vw, 150px); height: auto; }
.arena .monster { width: min(38vw, 190px); height: auto; }
.fighter-name { font-weight: 700; font-size: 15px; color: var(--chalk-dim); text-align: center; }
.tally { width: 100%; max-width: 190px; height: 26px; display: block; }
.tally line { stroke-width: 3; stroke-linecap: round; }
.tally .on { stroke: var(--chalk); }
.tally .off { stroke: var(--chalk-dim); opacity: .22; }
.combo {
  position: absolute; left: 50%; top: 4px; transform: translateX(-50%) rotate(-4deg);
  font: 700 18px var(--font-hand); color: var(--yellow); white-space: nowrap;
}
.bolt { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.bolt path { fill: none; stroke-linecap: round; }
.dmg-pop {
  position: absolute; pointer-events: none;
  font: 400 44px var(--font-display); color: var(--yellow);
  text-shadow: 0 0 12px rgba(245, 213, 97, .5);
  animation: pop-up 1s ease-out forwards;
}
.dmg-pop.hurt { color: var(--coral); text-shadow: 0 0 12px rgba(255, 154, 127, .5); }
.dmg-pop.heal { color: var(--mint); text-shadow: 0 0 12px rgba(159, 224, 180, .5); }
.dmg-pop.buff { color: var(--blue); font-size: 32px; text-shadow: 0 0 12px rgba(143, 208, 240, .5); white-space: nowrap; }

/* Power-ups */
.side { display: grid; gap: 12px; min-width: 0; align-content: start; }
.kit { display: grid; gap: 8px; }
.items { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding-top: 6px; }
.item {
  position: relative; display: grid; justify-items: center; align-content: start; gap: 2px;
  min-height: 62px; padding: 8px 4px 6px;
  border: 2px dashed rgba(243, 239, 228, .42); border-radius: var(--wobble);
  background: rgba(0, 0, 0, .12); cursor: pointer;
  touch-action: manipulation;
}
.item:hover { background: rgba(243, 239, 228, .08); }
.item .ico { width: 30px; height: 30px; }
.item-name { font-size: 12.5px; font-weight: 700; color: var(--chalk-dim); line-height: 1.2; }
.item-count {
  position: absolute; top: -9px; right: -5px;
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
  display: grid; place-items: center;
  background: var(--chalk); color: var(--ink);
  font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.item.is-empty .ico, .item.is-empty .item-name { opacity: .4; }
.item.is-empty .item-count { background: var(--chalk-dim); }
.item.is-open { border-style: solid; border-color: var(--chalk); }
.item.is-active { border-style: solid; border-color: var(--yellow); background: rgba(245, 213, 97, .14); }
.item.is-active .item-name { color: var(--yellow); }
.item-info {
  display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center;
  padding: 10px 12px; border: 2px solid rgba(243, 239, 228, .5); border-radius: var(--wobble);
  background: rgba(0, 0, 0, .18);
}
.item-info > .ico { width: 34px; height: 34px; }
.item-text { display: grid; gap: 2px; flex: 1 1 170px; min-width: 0; font-size: 15px; line-height: 1.4; }
.item-text b { font-size: 17px; }
.item-why { color: var(--coral); }
.item-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.loot {
  display: flex; gap: 10px; align-items: center; text-align: left;
  padding: 8px 12px; border: 2px dashed var(--yellow); border-radius: var(--wobble);
  color: var(--yellow); font-weight: 700;
}
.loot .ico { width: 32px; height: 32px; }
.fighter.shielded::after {
  content: ""; position: absolute; left: 50%; top: 0; width: 96%; height: 78%;
  transform: translateX(-50%);
  border: 3px dashed var(--blue); border-radius: 50%;
  box-shadow: 0 0 18px rgba(143, 208, 240, .45), inset 0 0 22px rgba(143, 208, 240, .22);
  animation: shield-pulse 2.4s ease-in-out infinite; pointer-events: none;
}
.fighter.doubled::before {
  content: "×2"; position: absolute; left: 4%; top: 2%; z-index: 1;
  font: 700 24px var(--font-hand); color: var(--yellow); transform: rotate(-8deg);
  text-shadow: 0 0 10px rgba(245, 213, 97, .5);
}
@keyframes shield-pulse { 50% { opacity: .6; transform: translateX(-50%) scale(1.03); } }
.inv { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.inv > span:not(.eyebrow) { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-variant-numeric: tabular-nums; }
.inv .ico { width: 26px; height: 26px; }

.panel { display: grid; gap: 12px; min-width: 0; align-content: start; }
.spells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.spell {
  display: grid; justify-items: center; align-content: start; gap: 4px; text-align: center;
  padding: 12px 6px 10px;
  border: 2.5px solid var(--chalk); border-radius: var(--wobble);
  background: rgba(243, 239, 228, .04); cursor: pointer;
  transition: background .15s, transform .1s;
}
.spell:hover { background: rgba(243, 239, 228, .1); transform: translateY(-2px); }
.spell .ico { width: 42px; height: 42px; }
.spell-name { font: 400 22px var(--font-display); line-height: 1.1; }
.spell-power { font-weight: 700; font-size: 15px; color: var(--yellow); }
.spell-level { font-size: 13px; color: var(--chalk-dim); }

.puzzle { display: grid; gap: 12px; min-width: 0; }
.pz-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border: 1.5px solid rgba(243, 239, 228, .4); border-radius: 999px;
  font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--chalk-dim);
}
.tag .ico { width: 18px; height: 18px; }
.prompt { font-size: 19px; line-height: 1.45; max-width: 40em; }
.visual { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; min-width: 0; padding: 4px 0; }
.visual:empty { display: none; }
.pz-note { width: 100%; text-align: center; color: var(--chalk-dim); font-size: 16px; }
.pz-note b { color: var(--yellow); font-size: 20px; }

.seq { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip {
  min-width: 46px; padding: 6px 10px; text-align: center;
  border: 2px solid rgba(243, 239, 228, .55); border-radius: 10px 13px 9px 12px;
  font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.chip-q { border-color: var(--yellow); border-style: dashed; color: var(--yellow); }
.chip-op { border-color: var(--blue); color: var(--blue); }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
.arrow { color: var(--chalk-dim); font-size: 20px; }
.magic { display: grid; grid-template-columns: repeat(3, 58px); gap: 6px; }
.cell {
  height: 58px; display: grid; place-items: center;
  border: 2.5px solid var(--chalk); border-radius: 8px 10px 7px 11px;
  font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.cell-empty { border-style: dashed; border-color: rgba(243, 239, 228, .4); }
.cell-q { border-style: dashed; border-color: var(--yellow); color: var(--yellow); background: rgba(245, 213, 97, .1); }
.eqs { display: grid; gap: 8px; justify-items: start; }
.eq { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.eq .ico { width: 38px; height: 38px; }
.op { font-size: 24px; font-weight: 700; min-width: 16px; text-align: center; }
.num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.num-q { color: var(--yellow); }
.eq-ask { padding-top: 6px; border-top: 2px dashed rgba(243, 239, 228, .3); }
.facts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.fact { display: grid; justify-items: center; padding: 8px 16px; border: 2px solid rgba(243, 239, 228, .45); border-radius: var(--wobble); }
.fact b { font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fact span { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--chalk-dim); font-weight: 700; }
.week { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.wday { width: 36px; height: 36px; display: grid; place-items: center; border: 2px solid rgba(243, 239, 228, .4); border-radius: 50%; font-size: 14px; font-weight: 700; }
.wday-on { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.clock { width: 128px; height: 128px; }
.clock-face { fill: none; stroke: var(--chalk); stroke-width: 3; }
.clock-ticks line { stroke: var(--chalk); stroke-width: 2.6; stroke-linecap: round; }
.clock-min { stroke: var(--chalk); stroke-width: 3.5; stroke-linecap: round; }
.clock-hour { stroke: var(--yellow); stroke-width: 5.5; stroke-linecap: round; }
.clock-pin { fill: var(--chalk); }
.expr { font-size: clamp(21px, 5vw, 27px); font-weight: 700; line-height: 1.45; text-align: center; text-wrap: balance; font-variant-numeric: tabular-nums; max-width: 100%; overflow-wrap: anywhere; }
.gridsvg { max-width: 100%; height: auto; }
.g-lines line { stroke: var(--chalk); stroke-width: 2.5; stroke-linecap: round; }
.g-dot { fill: var(--yellow); }
.g-lbl { fill: var(--ink); font: 700 11px var(--font-body); text-anchor: middle; dominant-baseline: central; }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.tile { width: 44px; height: 44px; display: inline-grid; place-items: center; }
.tile-q { border: 2.5px dashed var(--yellow); border-radius: 10px; color: var(--yellow); font-size: 24px; font-weight: 700; }
.tile g { stroke: var(--chalk); stroke-width: 1.5; stroke-linejoin: round; }
.t-yellow { fill: var(--yellow); } .t-pink { fill: var(--pink); } .t-blue { fill: var(--blue); } .t-mint { fill: var(--mint); } .t-chalk { fill: var(--chalk); }

/* Answer area */
.answer { display: grid; gap: 10px; }
.answer-box {
  min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 2px;
  border-bottom: 3px solid var(--chalk);
  font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .04em;
}
.answer-box .placeholder { font: 400 18px var(--font-hand); color: var(--chalk-dim); letter-spacing: 0; }
.caret { width: 3px; height: 34px; background: var(--yellow); animation: blink 1s steps(1) infinite; }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.key {
  min-height: 52px; border: 2px solid rgba(243, 239, 228, .55); border-radius: 12px 15px 11px 14px;
  background: rgba(243, 239, 228, .04); cursor: pointer;
  font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums;
  touch-action: manipulation;
}
.key:hover { background: rgba(243, 239, 228, .1); }
.key:active { transform: translateY(1px); background: rgba(243, 239, 228, .16); }
.key-cast { background: var(--yellow); border-color: var(--yellow); color: var(--ink); font-size: 19px; }
.key-cast:hover { background: #f8df80; }
.key-cast[disabled] { opacity: .45; cursor: not-allowed; }
.choices { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choices.days { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.choices.tiles-choice { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.choice {
  min-height: 58px; display: grid; place-items: center;
  border: 2.5px solid rgba(243, 239, 228, .55); border-radius: var(--wobble);
  background: rgba(243, 239, 228, .04); cursor: pointer;
  font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.days .choice { font-size: 17px; min-height: 50px; }
.choice .tile { width: 48px; height: 48px; }
.choice:hover { background: rgba(243, 239, 228, .1); }
.choice[aria-pressed="true"] { border-color: var(--yellow); background: rgba(245, 213, 97, .18); color: var(--yellow); }
.pz-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.hint-note {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 12px; border: 2px dashed rgba(245, 213, 97, .6); border-radius: var(--wobble);
}
.hint-note .ico { width: 24px; height: 24px; margin-top: 2px; }

/* Feedback */
.feedback { display: grid; gap: 12px; padding: 16px; border: 2.5px solid var(--chalk); border-radius: var(--wobble); background: rgba(0, 0, 0, .14); }
.feedback.good { border-color: var(--mint); }
.feedback.bad { border-color: var(--coral); }
.fb-title { font: 400 clamp(28px, 7vw, 36px) var(--font-display); line-height: 1.1; }
.good .fb-title { color: var(--mint); }
.bad .fb-title { color: var(--coral); }
.fb-line { font-size: 18px; }
.fb-explain { font-size: 17px; line-height: 1.55; max-width: 40em; padding-top: 10px; border-top: 2px dashed rgba(243, 239, 228, .25); }
.fb-explain .eyebrow { display: block; margin-bottom: 4px; }
.feedback .btn { justify-self: start; }

/* Results and certificate */
.result { display: grid; gap: 16px; justify-items: center; text-align: center; margin: auto 0; }
.result .monster, .result .mage { width: min(46vw, 200px); height: auto; }
.result .rate .ico { width: 46px; height: 46px; }
.result.lost .monster { transform: none; }
.result .row { justify-content: center; }
.cert {
  position: relative; display: grid; gap: 12px; justify-items: center; text-align: center;
  padding: 26px 20px; margin: auto 0;
  border: 3px solid var(--chalk); border-radius: 12px;
  outline: 2px dashed rgba(243, 239, 228, .45); outline-offset: -12px;
}
.cert .mage { width: min(40vw, 170px); height: auto; }
.cert-name { font: 400 clamp(36px, 10vw, 58px) var(--font-display); color: var(--yellow); line-height: 1; }
.cert-sign { font-family: var(--font-hand); font-size: 22px; color: var(--chalk); }
.cert-meta { display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: center; color: var(--chalk-dim); font-size: 15px; }

@media (min-width: 860px) {
  .battle-body { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; gap: 28px; }
  .side { position: sticky; top: 0; padding-top: 24px; }
  .arena .mage { width: min(17vw, 190px); }
  .arena .monster { width: min(22vw, 240px); }
  .choices.days { grid-template-columns: repeat(7, minmax(0, 1fr)); }
}
@media (max-width: 380px) {
  .magic { grid-template-columns: repeat(3, 52px); }
  .cell { height: 52px; font-size: 22px; }
  .spell-name { font-size: 19px; }
  .key { min-height: 48px; }
}


/* Chapters and monster tricks */
.chapter { display: grid; gap: 12px; }
.chapter + .chapter { margin-top: 6px; padding-top: 16px; border-top: 2px dashed rgba(243, 239, 228, .25); }
.chapter-head { display: grid; gap: 2px; }
.chapter-locked .chapter-head .h3 { color: var(--chalk-dim); }
.traits { display: grid; gap: 8px; width: 100%; max-width: 34em; text-align: left; padding: 12px 14px; border: 2px dashed var(--coral); border-radius: var(--wobble); }
.trait { display: flex; gap: 10px; align-items: flex-start; }
.trait .ico { width: 24px; height: 24px; margin-top: 1px; }
.trait b { color: var(--coral); }
.trait-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.trait-tag { padding: 1px 8px; border: 1.5px solid currentColor; border-radius: 999px; color: var(--coral); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
.spell[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.spell[disabled] .spell-power { color: var(--coral); }
.clues { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; width: 100%; max-width: 30em; }
.clues li { position: relative; padding: 8px 12px 8px 34px; border: 2px solid rgba(243, 239, 228, .4); border-radius: var(--wobble); font-size: 17px; }
.clues li::before { content: "?"; position: absolute; left: 11px; top: 7px; font: 700 18px var(--font-hand); color: var(--yellow); }
.shape { max-width: 100%; height: auto; }
.sh-grid line { stroke: rgba(243, 239, 228, .22); stroke-width: 1; }
.sh-fill rect { fill: var(--yellow); opacity: .28; }
.sh-edge line { stroke: var(--chalk); stroke-width: 3; stroke-linecap: round; }
.sh-out { fill: rgba(245, 213, 97, .2); stroke: var(--chalk); stroke-width: 3; stroke-linejoin: round; }
.sh-lbl { fill: var(--yellow); font: 700 13px var(--font-body); }

/* ---------- Motion ---------- */
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes hit { 0% { transform: translateX(0); filter: brightness(1); } 15% { transform: translateX(12px) rotate(5deg); filter: brightness(1.8); } 40% { transform: translateX(-9px) rotate(-3deg); } 65% { transform: translateX(5px); } 100% { transform: translateX(0); filter: brightness(1); } }
@keyframes lunge { 0% { transform: translateX(0); } 35% { transform: translateX(-34px) scale(1.08); } 100% { transform: translateX(0); } }
@keyframes hurt { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes cast { 0% { transform: rotate(0); } 40% { transform: rotate(-6deg) translateY(-4px); } 100% { transform: rotate(0); } }
@keyframes pop-up { 0% { opacity: 0; transform: translateY(10px) scale(.6); } 20% { opacity: 1; transform: translateY(0) scale(1.15); } 100% { opacity: 0; transform: translateY(-46px) scale(1); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes rise-in { from { transform: translateY(8px); opacity: .001; } to { transform: none; opacity: 1; } }
@keyframes beaten { to { transform: translateY(14px) rotate(-12deg); opacity: .35; } }
.idle { animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
.is-hit { animation: hit .55s ease-out; }
.is-lunge { animation: lunge .5s ease-in-out; }
.is-hurt { animation: hurt .45s ease-out; }
.is-cast { animation: cast .5s ease-out; transform-origin: 50% 90%; }
.is-beaten { animation: beaten .8s ease-in forwards; }
.enter { animation: rise-in .28s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .idle, .is-hit, .is-lunge, .is-hurt, .is-cast, .enter, .caret, .fighter.shielded::after { animation: none !important; }
  .is-beaten { animation: none; opacity: .35; }
  .dmg-pop { animation-duration: .01s; }
  .spell:hover { transform: none; }
}

.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<div class="app">
  <main class="board" id="board">
    <section class="screen title-screen"><div class="wrap"><h1 class="display title-word">Math Is <em>Magic</em></h1><p class="hand">Every spell is a puzzle. Solve it to cast it.</p></div></section>
  </main>
  <div class="ledge" aria-hidden="true"></div>
</div>
<div id="sr" class="sr-only" aria-live="polite"></div>
<script>
/* Math Is Magic: puzzle engine, part 1 (helpers, number patterns, magic squares) */
(function (root) {
  'use strict';
  const P = root.Puzzles = root.Puzzles || {};

  const rnd = {
    int(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },
    pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    },
    chance(p) { return Math.random() < p; }
  };
  P.rnd = rnd;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  P.esc = esc;

  // Friendly cast for story puzzles (Indonesian names: star, moon, rainbow, dew)
  P.NPCS = [
    { name: 'Wizard Bintang', he: 'He', his: 'his' },
    { name: 'Bulan the owl', he: 'She', his: 'her' },
    { name: 'Professor Pelangi', he: 'She', his: 'her' },
    { name: 'Embun the fox', he: 'He', his: 'his' }
  ];

  // HTML helpers. They return strings so the engine also runs in Node tests.
  const h = {
    seq(items) {
      return '<div class="seq">' + items.map(v =>
        v === '?' ? '<span class="chip chip-q">?</span>' : '<span class="chip">' + esc(v) + '</span>'
      ).join('') + '</div>';
    },
    expr(text) { return '<div class="expr">' + text + '</div>'; },
    facts(pairs) {
      return '<div class="facts">' + pairs.map(([n, label]) =>
        '<div class="fact"><b>' + esc(n) + '</b><span>' + esc(label) + '</span></div>'
      ).join('') + '</div>';
    },
    note(text) { return '<p class="pz-note">' + text + '</p>'; }
  };
  P.h = h;

  /* ---------- 1. Number patterns ---------- */
  const PATTERN_KINDS = {
    1: ['add'],
    2: ['sub', 'double'],
    3: ['growing', 'interleave'],
    4: ['fib', 'squares', 'triangle', 'triple'],
    5: ['squarePlus', 'doublePlus', 'doublingGaps', 'cubes']
  };

  function genPattern(t) {
    const { int, pick } = rnd;
    const kind = pick(PATTERN_KINDS[t]);
    let seq, ans, rule, hint = 'Look at how each number changes from the one before.';
    const last = () => seq[seq.length - 1];
    switch (kind) {
      case 'add': {
        const a = int(1, 20), d = int(2, 9);
        seq = [0, 1, 2, 3].map(i => a + i * d); ans = a + 4 * d;
        rule = `Each number is ${d} more than the one before, so the next is ${last()} + ${d} = ${ans}.`;
        break;
      }
      case 'sub': {
        const d = int(3, 9), a = int(5 * d, 99);
        seq = [0, 1, 2, 3].map(i => a - i * d); ans = a - 4 * d;
        rule = `Each number is ${d} less than the one before, so the next is ${last()} − ${d} = ${ans}.`;
        break;
      }
      case 'double': {
        const a = int(1, 6);
        seq = [0, 1, 2, 3].map(i => a * 2 ** i); ans = a * 16;
        rule = `Each number is double the one before, so the next is ${last()} × 2 = ${ans}.`;
        hint = 'Try multiplying instead of adding.';
        break;
      }
      case 'growing': {
        const a = int(1, 12), s = int(1, 3);
        seq = [a]; let gap = s;
        for (let i = 0; i < 4; i++) { seq.push(last() + gap); gap++; }
        ans = last() + gap;
        rule = `The gaps grow by 1 each time: +${s}, +${s + 1}, +${s + 2}, +${s + 3}. The next gap is +${s + 4}, so ${last()} + ${s + 4} = ${ans}.`;
        hint = 'Write down the gaps between neighbours. What do you notice about the gaps?';
        break;
      }
      case 'interleave': {
        const a = int(1, 9), d = int(2, 5), b = int(30, 50), e = int(2, 5);
        seq = [a, b, a + d, b - e, a + 2 * d, b - 2 * e]; ans = a + 3 * d;
        rule = `Two patterns take turns. The 1st, 3rd and 5th numbers go ${a}, ${a + d}, ${a + 2 * d}, adding ${d} each time. The others go down by ${e}. The 7th number belongs to the first pattern: ${a + 2 * d} + ${d} = ${ans}.`;
        hint = 'Read every other number. Two patterns are mixed together.';
        break;
      }
      case 'fib': {
        const a = int(1, 5), b = int(a, a + 4);
        seq = [a, b];
        while (seq.length < 6) seq.push(seq[seq.length - 1] + seq[seq.length - 2]);
        ans = seq[4] + seq[5];
        rule = `Each number is the sum of the two before it, so the next is ${seq[4]} + ${seq[5]} = ${ans}.`;
        hint = 'Try adding two neighbours together.';
        break;
      }
      case 'squares': {
        const k = int(1, 6);
        seq = [0, 1, 2, 3, 4].map(i => (k + i) ** 2); ans = (k + 5) ** 2;
        rule = `These are square numbers: ${k} × ${k}, ${k + 1} × ${k + 1}, and so on. The next is ${k + 5} × ${k + 5} = ${ans}.`;
        hint = 'Is something special about 4, 9, 16 and 25?';
        break;
      }
      case 'triangle': {
        const k = int(1, 5), T = n => n * (n + 1) / 2;
        seq = [0, 1, 2, 3, 4].map(i => T(k + i)); ans = T(k + 5);
        rule = `The gaps are +${k + 1}, +${k + 2}, +${k + 3}, +${k + 4}, so the next gap is +${k + 5}: ${last()} + ${k + 5} = ${ans}. These are triangle numbers.`;
        hint = 'Look at the gaps between neighbours.';
        break;
      }
      case 'triple': {
        const a = int(1, 3);
        seq = [0, 1, 2, 3].map(i => a * 3 ** i); ans = a * 81;
        rule = `Each number is 3 times the one before, so the next is ${last()} × 3 = ${ans}.`;
        hint = 'Try multiplying instead of adding.';
        break;
      }
      case 'squarePlus': {
        const c = int(1, 6), k = int(1, 3);
        seq = [0, 1, 2, 3, 4].map(i => (k + i) ** 2 + c); ans = (k + 5) ** 2 + c;
        rule = `Each number is a square number plus ${c}: ${k} × ${k} + ${c}, ${k + 1} × ${k + 1} + ${c}, and so on. The next is ${k + 5} × ${k + 5} + ${c} = ${ans}.`;
        hint = 'Take the same amount away from every number. Do you see square numbers?';
        break;
      }
      case 'doublePlus': {
        const c = pick([1, -1]), a = int(2, 5);
        seq = [a];
        while (seq.length < 5) seq.push(last() * 2 + c);
        ans = last() * 2 + c;
        rule = `Double the number, then ${c > 0 ? 'add' : 'take away'} 1. So the next is ${last()} × 2 ${c > 0 ? '+' : '−'} 1 = ${ans}.`;
        hint = 'Compare each number with double the one before it.';
        break;
      }
      case 'doublingGaps': {
        const a = int(1, 20);
        seq = [a, a + 1, a + 3, a + 7, a + 15]; ans = a + 31;
        rule = `The gaps double each time: +1, +2, +4, +8. The next gap is +16, so ${last()} + 16 = ${ans}.`;
        hint = 'Write the gaps between neighbours. How do the gaps change?';
        break;
      }
      case 'cubes': {
        const k = int(1, 3);
        seq = [0, 1, 2, 3].map(i => (k + i) ** 3); ans = (k + 4) ** 3;
        rule = `These are cube numbers (a number times itself, times itself again). The next is ${k + 4} × ${k + 4} × ${k + 4} = ${ans}.`;
        hint = 'Think about 2 × 2 × 2 and 3 × 3 × 3.';
        break;
      }
    }
    return {
      type: 'pattern', label: 'Number pattern',
      prompt: 'What number comes next?',
      html: h.seq(seq.concat('?')),
      input: 'number', answer: ans, hint, explain: rule,
      data: { kind, seq, ans }
    };
  }

  /* ---------- 2. Magic squares ---------- */
  const LO_SHU = [2, 7, 6, 9, 5, 1, 4, 3, 8];
  const LINES = [
    { name: 'top row', cells: [0, 1, 2] }, { name: 'middle row', cells: [3, 4, 5] }, { name: 'bottom row', cells: [6, 7, 8] },
    { name: 'left column', cells: [0, 3, 6] }, { name: 'middle column', cells: [1, 4, 7] }, { name: 'right column', cells: [2, 5, 8] },
    { name: 'diagonal from the top left', cells: [0, 4, 8] }, { name: 'diagonal from the top right', cells: [2, 4, 6] }
  ];
  P.MAGIC_LINES = LINES;

  function symmetries(g) {
    const rot = a => [a[6], a[3], a[0], a[7], a[4], a[1], a[8], a[5], a[2]];
    const flip = a => [a[2], a[1], a[0], a[5], a[4], a[3], a[8], a[7], a[6]];
    const out = []; let cur = g;
    for (let i = 0; i < 4; i++) { out.push(cur, flip(cur)); cur = rot(cur); }
    return out;
  }

  // Fill the grid using only "a line with one gap" steps. Records the round in which each cell is found.
  function magicRounds(vals, hidden, showSum) {
    const known = vals.map((v, i) => hidden.includes(i) ? null : v);
    let sumLine = null;
    if (!showSum) {
      sumLine = LINES.find(L => L.cells.every(c => known[c] !== null));
      if (!sumLine) return null;
    }
    const S = vals[0] + vals[1] + vals[2];
    const round = {}, via = {};
    for (let r = 1; r < 10; r++) {
      const found = [];
      for (const L of LINES) {
        const unk = L.cells.filter(c => known[c] === null);
        if (unk.length === 1 && !found.some(f => f.cell === unk[0])) found.push({ cell: unk[0], line: L });
      }
      if (!found.length) break;
      for (const f of found) { known[f.cell] = vals[f.cell]; round[f.cell] = r; via[f.cell] = f.line; }
    }
    return { S, sumLine, round, via };
  }

  const MAGIC_CFG = {
    1: { m: [1, 1], k: [0, 0], hide: 1, showSum: true, chain: 0 },
    2: { m: [1, 1], k: [1, 9], hide: 2, showSum: true, chain: 0 },
    3: { m: [1, 2], k: [0, 10], hide: 3, showSum: false, chain: 0 },
    4: { m: [2, 3], k: [0, 12], hide: 4, showSum: false, chain: 2 },
    5: { m: [2, 5], k: [0, 20], hide: 5, showSum: false, chain: 3 }
  };

  function genMagic(t) {
    const { int, pick, shuffle } = rnd;
    const cfg = MAGIC_CFG[t];
    for (let attempt = 0; attempt < 2000; attempt++) {
      const chain = attempt > 1500 ? 0 : cfg.chain;
      const m = int(cfg.m[0], cfg.m[1]), k = int(cfg.k[0], cfg.k[1]);
      const vals = pick(symmetries(LO_SHU)).map(v => v * m + k);
      const hidden = shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]).slice(0, cfg.hide);
      const res = magicRounds(vals, hidden, cfg.showSum);
      if (!res || hidden.some(c => !(c in res.round))) continue;
      const maxR = Math.max(...hidden.map(c => res.round[c]));
      if (maxR < chain) continue;
      const target = pick(hidden.filter(c => res.round[c] === maxR));

      // Steps needed to reach the target, in a sensible order
      const order = [];
      const need = c => {
        if (order.includes(c)) return;
        res.via[c].cells.forEach(o => { if (o !== c && hidden.includes(o)) need(o); });
        order.push(c);
      };
      need(target);
      const lines = [];
      if (cfg.showSum) lines.push(`The magic total is ${res.S}.`);
      else {
        const L = res.sumLine;
        lines.push(`The ${L.name} is complete: ${L.cells.map(c => vals[c]).join(' + ')} = ${res.S}. So every line adds up to ${res.S}.`);
      }
      order.forEach(c => {
        const others = res.via[c].cells.filter(o => o !== c).map(o => vals[o]);
        lines.push(`In the ${res.via[c].name}: ${res.S} − ${others[0]} − ${others[1]} = ${vals[c]}.`);

  /* ---------- 8. Counting ---------- */
  function gridSVG(cols, rows, ab) {

    </div>`;
  }

  function feedbackHTML() {
    const b = state.battle, p = b.puzzle, r = REALMS[b.realm], L = b.last, s = SPELLS[b.spell];
    let line;
    if (L.ok) {
      const helpers = [];
      if (L.doubled) helpers.push('Double Chalk');
      if (L.bonus) helpers.push('your combo');
      line = `${s.name} hits ${r.foe} for ${L.dmg}${helpers.length ? `, thanks to ${helpers.join(' and ')}` : ''}.` + (b.hp === 0 ? ` ${r.foe} is beaten!` : '');
    } else {
      const picked = p.input === 'number' ? null : (p.choices.find(c => c.id === L.given) || {}).aria || '';
      const given = p.input === 'number' ? L.given : (p.choiceStyle === 'tiles' ? 'the ' + picked : picked);
      line = `You answered ${esc(given)}, but the answer is ${esc(Pz.answerText(p))}. ` +
        (L.blocked ? `${r.foe} hits back, but your Shield Charm blocks it. No heart lost!`
          : `${r.foe} hits back and you lose a heart.` + (b.hearts === 0 ? ' That was your last heart.' : '')) +
        (L.stole ? ` ${r.foe} snatches your ${ITEMS[L.stole].name}!` : '') +
        (L.regrew ? ` ${r.foe} regrows 1 hit point.` : '');
    }
    const loot = L.drop ? `<p class="loot">${Art.icon(ITEMS[L.drop].icon)}<span>${L.streak} in a row! You found ${ITEMS[L.drop].a} ${ITEMS[L.drop].name}.</span></p>` : '';
    const btn = b.hp === 0 ? 'Claim victory' : b.hearts === 0 ? 'Continue' : 'Next spell';
    return `<div class="feedback ${L.ok ? 'good' : 'bad'} enter">
      <h3 class="fb-title">${L.title}</h3>
      <p class="fb-line">${line}</p>
      ${loot}
      <div class="fb-explain"><span class="eyebrow">${L.ok ? 'The trick' : 'How to solve it'}</span>${esc(p.explain)}</div>
      <button class="btn btn-primary" id="next-btn" data-act="next">${btn}</button>
    </div>`;
  }

  function panelHTML() {
    const ph = state.battle.phase;
    return ph === 'spell' ? spellHTML() : ph === 'puzzle' ? puzzleHTML() : feedbackHTML();
  }

  M.screens.battle = () => {
    const b = state.battle, r = REALMS[b.realm], H = state.save.hero;
    const foeCls = b.hp === 0 ? 'is-beaten' : 'idle';
    return `<section class="screen battle" id="battle-screen" aria-labelledby="b-title"><div class="wrap">
      <div class="topbar">
        <button class="icon-btn" data-act="quitBattle" aria-label="Leave the battle">${Art.icon('back')}</button>
        <div class="grow"><p class="eyebrow">Realm ${b.realm + 1}</p><h2 id="b-title" class="realm-name">${r.name}</h2></div>
        ${M.soundBtn()}
      </div>
      <div class="battle-body">
        <div class="side">
          <div class="arena" id="arena">
            <div class="${mageClass()}" id="f-mage">${Art.mage(H, 'idle')}<span class="fighter-name">${esc(M.heroName())}</span><div class="hearts" id="hearts" role="img" aria-label="${b.hearts} of ${M.MAX_HEARTS} hearts">${heartsHTML()}</div></div>
            <div class="fighter" id="f-foe">${Art.monster(r.monster, foeCls, r.foe)}<span class="fighter-name">${r.foe}</span>${tallyHTML()}${r.traits ? `<div class="trait-tags">${r.traits.map(t => `<span class="trait-tag">${M.TRAITS[t].name}</span>`).join('')}</div>` : ''}</div>
            <div class="combo" id="combo">${comboText()}</div>
          </div>
          <div class="kit" id="kit">${kitHTML()}</div>
        </div>
        <div class="panel" id="panel">${panelHTML()}</div>
      </div>
    </div></section>`;
  };

  /* ---------- Partial updates ---------- */
  function refreshPanel(scroll) {
    const panel = $('panel');
    if (!panel) return;
    panel.innerHTML = panelHTML();
    if (scroll) {
      const sc = $('battle-screen');
      if (sc && window.innerWidth < 860) {
        const top = panel.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 8;
        if (scroll === 'panel' || sc.scrollTop > top) sc.scrollTo({ top: Math.max(0, top), behavior: reduced() ? 'auto' : 'smooth' });
      }
    }
  }
  function refreshKit() { const kit = $('kit'); if (kit) kit.innerHTML = kitHTML(); }
  function refreshStatus() {
    const b = state.battle;
    const hearts = $('hearts');
    if (hearts) { hearts.innerHTML = heartsHTML(); hearts.setAttribute('aria-label', `${b.hearts} of ${M.MAX_HEARTS} hearts`); }
    const tally = $('tally');
    if (tally) tally.outerHTML = tallyHTML();
    const combo = $('combo');
    if (combo) combo.textContent = comboText();
    const mage = $('f-mage');
    if (mage) mage.className = mageClass();
  }
  function refreshAnswer() {
    const b = state.battle, box = $('answer-box'), btn = $('cast-btn');
    if (box) box.innerHTML = (b.input ? esc(b.input) : '<span class="placeholder">Type your answer</span>') + '<span class="caret" aria-hidden="true"></span>';
    if (btn) btn.disabled = b.puzzle.input === 'number' ? !b.input : b.choice === null;
    document.querySelectorAll('#answer .choice').forEach(c => c.setAttribute('aria-pressed', String(Number(c.dataset.arg) === b.choice)));
  }

  /* ---------- Animation helpers ---------- */
  function restart(el, cls) {
    if (!el) return;
    el.classList.remove(cls, 'idle');
    void el.getBoundingClientRect();
    el.classList.add(cls);
    el.addEventListener('animationend', function done(ev) {
      if (ev.target !== el) return;
      el.classList.remove(cls);
      if (!el.classList.contains('is-beaten')) el.classList.add('idle');
      el.removeEventListener('animationend', done);
    });
  }
  function pop(text, target, kind) {
    const arena = $('arena');
    if (!arena || !target) return;
    const a = arena.getBoundingClientRect(), t = target.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'dmg-pop' + (kind ? ' ' + kind : '');
    el.textContent = text;
    el.style.left = (t.left - a.left + t.width * 0.36) + 'px';
    el.style.top = (t.top - a.top + t.height * 0.12) + 'px';
    arena.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }
  function bolt(color, width, done) {
    const arena = $('arena'), mage = document.querySelector('#f-mage .mage'), foe = document.querySelector('#f-foe .monster');
    if (!arena || !mage || !foe || reduced() || !Element.prototype.animate) { done(); return; }
    const a = arena.getBoundingClientRect(), m = mage.getBoundingClientRect(), f = foe.getBoundingClientRect();
    const x1 = m.left - a.left + m.width * 0.94, y1 = m.top - a.top + m.height * 0.22;
    const x2 = f.left - a.left + f.width * 0.42, y2 = f.top - a.top + f.height * 0.5;
    const cy = Math.min(y1, y2) - Math.max(40, a.height * 0.25);
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'bolt'); svg.setAttribute('viewBox', `0 0 ${a.width} ${a.height}`); svg.setAttribute('aria-hidden', 'true');
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', `M${x1} ${y1} Q${(x1 + x2) / 2} ${cy} ${x2} ${y2}`);
    path.setAttribute('pathLength', '1');
    path.setAttribute('filter', 'url(#chalk)');
    path.style.cssText = `stroke:${color};stroke-width:${width};stroke-dasharray:1;stroke-dashoffset:1`;
    svg.appendChild(path); arena.appendChild(svg);
    const anim = path.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 420, easing: 'ease-in', fill: 'forwards' });
    anim.onfinish = () => {
      done();
      const fade = svg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
      fade.onfinish = () => svg.remove();
    };
  }

  function playHit(dmg, doubled) {
    const b = state.battle, mage = document.querySelector('#f-mage .mage'), foe = document.querySelector('#f-foe .monster');
    restart(mage, 'is-cast');
    sfx.cast(SPELLS[b.spell].power);
    bolt(doubled ? 'var(--chalk)' : SPELLS[b.spell].color, 4 + Math.min(dmg, 8) * 2, () => {
      sfx.hit();
      if (b.hp === 0 && foe) { foe.classList.remove('idle'); foe.classList.add('is-beaten'); }
      else restart(foe, 'is-hit');
      pop('−' + dmg, foe, '');
      refreshStatus();
    });
  }
  function playAttack(shielded, regrew, stole) {
    const mage = document.querySelector('#f-mage .mage'), foe = document.querySelector('#f-foe .monster');
    restart(foe, 'is-lunge');
    setTimeout(() => {
      if (shielded) { sfx.shield(); pop('Blocked!', mage, 'buff'); }
      else { sfx.hit(); restart(mage, 'is-hurt'); pop('−1', mage, 'hurt'); }
      refreshStatus();
    }, reduced() ? 0 : 260);
    if (regrew || stole) setTimeout(() => {
      if (regrew) { sfx.heal(); pop('+1', foe, 'heal'); }
      else { sfx.erase(); pop('Snatch!', foe, 'buff'); }
      refreshStatus(); refreshKit();
    }, reduced() ? 0 : 700);
  }

  /* ---------- Turn logic ---------- */
  function chooseSpell(i) {
    const b = state.battle;
    if (b.phase !== 'spell' || b.busy || (i === 0 && has('armored'))) return;
    b.spell = i; b.puzzle = makePuzzle(i);
    b.hintUsed = false; b.input = ''; b.choice = null; b.phase = 'puzzle';
    if (b.info && b.info !== 'eraser') b.info = null;
    refreshPanel('panel'); refreshKit();
  }
  function press(k) {
    const b = state.battle;
    if (b.phase !== 'puzzle' || b.puzzle.input !== 'number' || b.busy) return;
    if (k === 'del') b.input = b.input.slice(0, -1);
    else if (b.input.length < 5) b.input = b.input === '0' ? k : b.input + k;
    refreshAnswer();
  }
  function choose(id) {
    const b = state.battle;
    if (b.phase !== 'puzzle' || b.puzzle.input !== 'choice' || b.busy) return;
    b.choice = id; refreshAnswer();
  }
  function cast() {
    const b = state.battle;
    if (!b || b.phase !== 'puzzle' || b.busy) return;
    const p = b.puzzle;
    const val = p.input === 'number' ? b.input : b.choice;
    if (val === '' || val === null) return;
    const ok = Pz.check(p, p.input === 'number' ? Number(val) : val);
    b.cast++; b.info = null;
    if (ok) {
      const doubled = b.double, dmg = power(), bonus = b.streak >= 2;
      b.double = false;
      b.streak++;
      b.hp = Math.max(0, b.hp - dmg);
      const drop = b.streak % 3 === 0 ? grantRandom() : null;
      b.last = { ok: true, dmg, bonus, doubled, drop, streak: b.streak, given: val, title: Pz.rnd.pick(PRAISE) };
      sfx.correct();
      if (drop) sfx.loot();
      playHit(dmg, doubled);
      M.say(`Correct! ${SPELLS[b.spell].name} hits for ${dmg}.` + (drop ? ` You found ${ITEMS[drop].a} ${ITEMS[drop].name}.` : ''));
    } else {
      const shielded = b.shield;
      b.streak = 0; b.misses++;
      if (shielded) b.shield = false; else b.hearts = Math.max(0, b.hearts - 1);
      let regrew = false, stole = null;
      if (has('regrow') && b.hp < REALMS[b.realm].hp) { b.hp += 1; regrew = true; }
      if (has('thief') && !shielded) {
        const bag = inv(), owned = ITEM_IDS.filter(id => (bag[id] || 0) > 0);
        if (owned.length) { stole = Pz.rnd.pick(owned); bag[stole]--; b.stolen.push(stole); M.persist(); }
      }
      b.last = { ok: false, blocked: shielded, regrew, stole, given: val, title: 'Not quite' };
      sfx.wrong();
      playAttack(shielded, regrew, stole);
      M.say(`Not quite. The answer is ${Pz.answerText(p)}.` + (shielded ? ' Your shield blocked the hit.' : ''));
    }
    b.phase = 'feedback';
    b.busy = true;
    setTimeout(() => { b.busy = false; refreshKit(); }, reduced() ? 0 : 450);
    refreshPanel('panel'); refreshKit();
  }
  function next() {
    const b = state.battle;
    if (!b || b.phase !== 'feedback' || b.busy) return;
    if (b.hp === 0) return finish(true);
    if (b.hearts === 0) return finish(false);
    b.phase = 'spell'; b.puzzle = null; b.info = null;
    refreshPanel('panel'); refreshKit();
  }
  function useItem(id) {
    const b = state.battle;
    if (!b || !ITEMS[id] || blocked(id)) return;
    inv()[id]--;
    M.persist();
    b.info = null;
    const mage = document.querySelector('#f-mage .mage');
    if (id === 'shield') { b.shield = true; sfx.shield(); pop('Shield!', mage, 'buff'); M.say('Shield Charm is up. It blocks the next hit.'); }
    if (id === 'jamu') { b.hearts = Math.min(M.MAX_HEARTS, b.hearts + 1); sfx.heal(); pop('+1', mage, 'heal'); M.say('Jamu Potion. You got a heart back.'); }
    if (id === 'double') { b.double = true; sfx.power(); pop('×2', mage, ''); M.say('Double Chalk is ready for your next correct spell.'); }
    if (id === 'eraser') { b.puzzle = makePuzzle(b.spell); b.hintUsed = false; b.input = ''; b.choice = null; sfx.erase(); M.say('The board is wiped. Here is a new puzzle.'); }
    refreshStatus();
    refreshKit();
    if (id === 'eraser' || id === 'double') refreshPanel(id === 'eraser' ? 'panel' : false);
  }
  function finish(won) {
    const b = state.battle, s = state.save, i = b.realm;
    let unlockedNow = false, firstWin = false, drop = null;
    if (won) {
      s.stars[i] = Math.max(s.stars[i], b.hearts);
      if (i + 1 < REALMS.length && s.unlocked < i + 2) { s.unlocked = i + 2; unlockedNow = true; }
      const ci = M.CHAPTERS.findIndex(c => c.last === i);
      if (ci >= 0 && !s[M.CHAPTERS[ci].key]) {
        s[M.CHAPTERS[ci].key] = true; firstWin = true; state.finalChapter = ci;
        if (ci + 1 < M.CHAPTERS.length && s.unlocked < M.CHAPTERS[ci + 1].first + 1) s.unlocked = M.CHAPTERS[ci + 1].first + 1;
      }
      b.stolen.forEach(id => { inv()[id] = Math.min(MAX_ITEM, (inv()[id] || 0) + 1); });
      drop = grantRandom();
      sfx.win();
    } else sfx.lose();
    M.persist();
    state.result = { realm: i, won, stars: won ? b.hearts : 0, cast: b.cast, misses: b.misses, hints: b.hints, hpLeft: b.hp, unlockedNow, drop, returned: won ? b.stolen.slice() : [] };
    state.battle = null;
    M.go(firstWin ? 'final' : 'result');
  }

  Object.assign(M.actions, {
    fight: () => { newBattle(state.realm); M.go('battle'); },
    quitBattle: () => { state.battle = null; M.go('map'); },
    chooseSpell: arg => chooseSpell(Number(arg)),
    key: arg => press(arg),
    choose: arg => choose(Number(arg)),
    cast: () => cast(),
    next: () => next(),
    hint: () => {
      const b = state.battle;
      if (!b || b.phase !== 'puzzle' || b.hintUsed || has('gusty')) return;
      b.hintUsed = true; b.hints++;
      refreshPanel(false);
    },
    itemInfo: arg => {
      const b = state.battle;
      if (!b) return;
      b.info = arg && b.info !== arg ? arg : null;
      refreshKit();
    },
    useItem: arg => useItem(arg)
  });

  document.addEventListener('keydown', e => {
    const b = state.battle;
    if (state.screen !== 'battle' || !b || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (b.phase === 'puzzle') {
      const p = b.puzzle;
      if (p.input === 'number') {
        if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(e.key); }
        else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); press('del'); }
        else if (e.key === 'Enter') { e.preventDefault(); cast(); }
      } else {
        const n = Number(e.key);
        if (n >= 1 && n <= p.choices.length) { e.preventDefault(); choose(p.choices[n - 1].id); }
        else if (e.key === 'Enter') { e.preventDefault(); if (b.choice !== null) cast(); }
      }
    } else if (b.phase === 'spell' && /^[1-3]$/.test(e.key)) {
      e.preventDefault(); chooseSpell(Number(e.key) - 1);
    } else if (b.phase === 'feedback' && e.key === 'Enter') {
      e.preventDefault(); next();
    }
  });

  // Small hook for automated play-testing
  window.__mim = { state, cast, press, choose, chooseSpell, next, useItem };
  M.boot();
})();

</script>
</body>
</html>
