<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A chalkboard adventure where every spell is a math puzzle. Dress your mage, collect power-ups and beat ten monsters.">
<meta name="theme-color" content="#4a2c17">
<meta property="og:title" content="Math Is Magic">
<meta property="og:description" content="A chalkboard adventure where every spell is a math puzzle.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%231e3a30%22%2F%3E%3Cpath%20d%3D%22M32%208l6.5%2015.6%2016.9%201.4-12.9%2011%204%2016.5L32%2043.6%2017.5%2052.5l4-16.5-12.9-11%2016.9-1.4z%22%20fill%3D%22%23f5d561%22%20stroke%3D%22%23f3efe4%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Math Is Magic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredericka+the+Great&family=Kalam:wght@400;700&display=swap">
<style>
:root {
  /* Layout: a wood-framed chalkboard fills the screen. Everything on it is drawn in chalk; one screen shows at a time and scrolls inside the board. */
  --slate: #1e3a30;
  --slate-hi: #28493d;
  --slate-lo: #15291f;
  --chalk: #f3efe4;
  --chalk-dim: #a9bcb1;
  --yellow: #f5d561;
  --pink: #f39ac0;
  --blue: #8fd0f0;
  --mint: #9fe0b4;
  --lilac: #c3a6f0;
  --coral: #ff9a7f;
  --sand: #e8c98a;
  --wood: #7a4b2a;
  --wood-dark: #4a2c17;
  --wood-light: #b07a4a;
  --ink: #2a2320;
  --font-display: "Fredericka the Great", "Rockwell", Georgia, serif;
  --font-body: "Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Kalam", "Chalkboard SE", "Comic Sans MS", cursive;
  --wobble: 16px 20px 14px 22px / 20px 14px 22px 16px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; background: var(--wood-dark); }
body {
  height: 100%; margin: 0;
  background: var(--wood-dark); color: var(--chalk);
  font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
.sprites { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- Frame and board ---------- */
.app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-block: 12px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    repeating-linear-gradient(92deg, rgba(0, 0, 0, .07) 0 2px, transparent 2px 11px),
    linear-gradient(180deg, var(--wood-light), var(--wood) 40%, var(--wood-dark));
}
.board {
  position: relative; flex: 1; min-height: 0;
  background: var(--slate);
  border-radius: 6px;
  box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .28), inset 0 0 70px rgba(0, 0, 0, .5), 0 1px 0 rgba(255, 255, 255, .18);
  overflow: hidden;
}
.board::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 40% 25% at 18% 28%, rgba(243, 239, 228, .07), transparent 70%),
    radial-gradient(ellipse 35% 22% at 78% 72%, rgba(243, 239, 228, .06), transparent 70%),
    radial-gradient(ellipse 50% 12% at 55% 12%, rgba(243, 239, 228, .045), transparent 70%);
}
.ledge {
  position: relative; flex: none; height: 18px; margin-inline: -6px;
  background: linear-gradient(180deg, var(--wood-light), var(--wood) 60%, var(--wood-dark));
  border-radius: 3px 3px 0 0;
  box-shadow: 0 -4px 8px rgba(0, 0, 0, .35);
  margin-bottom: env(safe-area-inset-bottom, 0px);
}
.ledge::before, .ledge::after {
  content: ""; position: absolute; top: -5px; height: 8px; border-radius: 4px;
}
.ledge::before { left: 18%; width: 46px; background: var(--chalk); transform: rotate(-3deg); }
.ledge::after { left: 26%; width: 30px; background: var(--pink); transform: rotate(4deg); }

.screen {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px 24px;
}
.wrap { width: 100%; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
.wrap-narrow { max-width: 640px; }

/* ---------- Type ---------- */
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
.display { font-family: var(--font-display); letter-spacing: .01em; text-shadow: 0 0 1px rgba(243, 239, 228, .5), 0 0 22px rgba(243, 239, 228, .1); }
.h2 { font-family: var(--font-display); font-size: clamp(28px, 6vw, 38px); line-height: 1.1; }
.h3 { font-family: var(--font-display); font-size: 24px; line-height: 1.15; }
.hand { font-family: var(--font-hand); color: var(--yellow); font-size: 19px; line-height: 1.35; }
.dim { color: var(--chalk-dim); }
.eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-dim); font-weight: 700; }
p { margin: 0; }

/* ---------- Buttons ---------- */
button { font: inherit; color: inherit; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 50px; padding: 10px 22px;
  border: 2.5px solid var(--chalk); border-radius: var(--wobble);
  background: rgba(243, 239, 228, .04);
  color: var(--chalk); font-family: var(--font-body); font-weight: 700; font-size: 18px;
  cursor: pointer; text-decoration: none;
  transition: background .15s, transform .08s;
  touch-action: manipulation;
}
.btn:hover { background: rgba(243, 239, 228, .1); }
.btn:active { transform: translateY(2px); }
.btn-primary { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.btn-primary:hover { background: #f8df80; }
.btn-small { min-height: 40px; padding: 6px 14px; font-size: 15px; }
.btn-ghost { border-color: transparent; background: none; color: var(--chalk-dim); text-decoration: underline; text-underline-offset: 4px; }
.btn-ghost:hover { background: rgba(243, 239, 228, .06); color: var(--chalk); }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }
.icon-btn {
  width: 44px; height: 44px; flex: none;
  display: inline-grid; place-items: center;
  border: 2px solid rgba(243, 239, 228, .5); border-radius: 50%;
  background: none; cursor: pointer; padding: 0;
}
.icon-btn:hover { background: rgba(243, 239, 228, .1); }
.icon-btn .ico { width: 24px; height: 24px; }
:focus-visible { outline: 3px dashed var(--yellow); outline-offset: 3px; }
.ico { width: 28px; height: 28px; display: inline-block; vertical-align: middle; flex: none; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* ---------- Title ---------- */
.title-screen .wrap { justify-content: center; align-items: center; text-align: center; gap: 14px; position: relative; }
.scribbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.scribbles span { position: absolute; font-family: var(--font-hand); color: var(--chalk); opacity: .16; font-size: 20px; white-space: nowrap; }
.title-top { position: absolute; top: 0; right: 0; }
.title-word { font-size: clamp(46px, 13vw, 96px); line-height: .95; }
.title-word em { font-style: normal; color: var(--yellow); }
.title-art { display: flex; align-items: flex-end; justify-content: center; gap: 4px; margin-top: 4px; }
.title-art .mage { width: min(46vw, 210px); height: auto; }
.title-art .monster { width: min(30vw, 150px); height: auto; opacity: .55; transform: scaleX(1); }
.title-actions { display: flex; flex-direction: column; gap: 10px; width: min(100%, 320px); }
.confirm { display: grid; gap: 10px; padding: 14px; border: 2px dashed var(--coral); border-radius: var(--wobble); }

/* ---------- Wardrobe ---------- */
.ward { display: grid; gap: 18px; }
.ward-preview { display: grid; place-items: center; }
.ward-preview .mage { width: min(52vw, 230px); height: auto; }
.ward-opts { display: grid; gap: 16px; min-width: 0; }
.opt { display: grid; gap: 8px; }
.opt-label { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--chalk-dim); font-weight: 700; }
.name-input {
  width: 100%; max-width: 360px;
  font: 700 24px var(--font-body); color: var(--chalk);
  background: transparent; border: 0; border-bottom: 3px solid var(--chalk);
  padding: 6px 2px; border-radius: 0;
}
.name-input:focus { outline: none; border-bottom-color: var(--yellow); }
.name-input::placeholder { color: var(--chalk-dim); font-weight: 400; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch {
  width: 42px; height: 42px; border-radius: 50%;
  border: 3px solid rgba(243, 239, 228, .35); cursor: pointer; padding: 0;
}
.swatch[aria-pressed="true"] { border-color: var(--chalk); box-shadow: 0 0 0 3px var(--slate), 0 0 0 6px var(--yellow); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  min-height: 42px; padding: 6px 16px;
  border: 2px solid rgba(243, 239, 228, .45); border-radius: var(--wobble);
  background: none; cursor: pointer; font-weight: 700;
}
.pill[aria-pressed="true"] { border-color: var(--yellow); background: rgba(245, 213, 97, .16); color: var(--yellow); }
@media (min-width: 760px) {
  .ward { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); align-items: center; }
  .ward-preview .mage { width: min(32vw, 300px); }
}

/* ---------- Map ---------- */
.topbar { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.topbar .grow { flex: 1; min-width: 0; }
.star-count { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.stops { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; position: relative; }
.stops::before {
  content: ""; position: absolute; left: 27px; top: 28px; bottom: 28px;
  border-left: 3px dashed rgba(243, 239, 228, .3);
}
.stop {
  position: relative;
  display: grid; grid-template-columns: 56px 70px minmax(0, 1fr); gap: 12px; align-items: center;
}
.stop-num {
  width: 56px; height: 56px; border-radius: 50%;
  display: grid; place-items: center;
  font: 400 28px var(--font-display);
  background: var(--slate); border: 3px solid var(--chalk);
  z-index: 1;
}
.stop.done .stop-num { background: var(--mint); color: var(--ink); border-color: var(--mint); }
.stop.locked .stop-num { border-style: dashed; color: var(--chalk-dim); border-color: var(--chalk-dim); }
.stop .monster { width: 70px; height: 70px; }
.stop.locked .monster { opacity: .3; filter: grayscale(1); }
.stop-info { display: grid; gap: 4px; min-width: 0; }
.stop-info .h3 { font-size: 22px; }
.stop-meta { color: var(--chalk-dim); font-size: 15px; }
.stop-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 4px; }
.rate { display: inline-flex; gap: 2px; }
.rate .ico { width: 22px; height: 22px; }
.locked-note { display: inline-flex; align-items: center; gap: 6px; color: var(--chalk-dim); font-size: 15px; }
.locked-note .ico { width: 20px; height: 20px; }
.story { padding: 12px 14px; border-left: 3px solid var(--yellow); background: rgba(0, 0, 0, .12); border-radius: 0 10px 10px 0; }
.map-foot { margin-top: auto; padding-top: 6px; }

/* ---------- Intro card ---------- */
.intro { display: grid; gap: 14px; justify-items: center; text-align: center; margin: auto 0; }
.intro .monster { width: min(56vw, 240px); height: auto; }
.rules { display: grid; gap: 8px; text-align: left; max-width: 34em; margin: 0; padding: 0; list-style: none; }
.rules li { display: flex; gap: 10px; align-items: flex-start; }
.rules .ico { width: 26px; height: 26px; margin-top: 1px; }

/* ---------- Battle ---------- */
.battle .wrap { gap: 12px; }
.hearts { display: inline-flex; gap: 2px; min-height: 26px; align-items: center; }
.hearts .ico { width: 26px; height: 26px; }
.realm-name { font-family: var(--font-display); font-size: 22px; line-height: 1.15; }
.battle-body { display: grid; gap: 14px; }
.arena {
  position: relative;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: end; gap: 8px;
  padding: 4px 0 0;
}
.fighter { display: grid; justify-items: center; gap: 4px; min-width: 0; position: relative; }
.arena .mage { width: min(30vw, 150px); height: auto; }
.arena .monster { width: min(38vw, 190px); height: auto; }
.fighter-name { font-weight: 700; font-size: 15px; color: var(--chalk-dim); text-align: center; }
.tally { width: 100%; max-width: 190px; height: 26px; display: block; }
.tally line { stroke-width: 3; stroke-linecap: round; }
.tally .on { stroke: var(--chalk); }
.tally .off { stroke: var(--chalk-dim); opacity: .22; }
.combo {
  position: absolute; left: 50%; top: 4px; transform: translateX(-50%) rotate(-4deg);
  font: 700 18px var(--font-hand); color: var(--yellow); white-space: nowrap;
}
.bolt { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.bolt path { fill: none; stroke-linecap: round; }
.dmg-pop {
  position: absolute; pointer-events: none;
  font: 400 44px var(--font-display); color: var(--yellow);
  text-shadow: 0 0 12px rgba(245, 213, 97, .5);
  animation: pop-up 1s ease-out forwards;
}
.dmg-pop.hurt { color: var(--coral); text-shadow: 0 0 12px rgba(255, 154, 127, .5); }
.dmg-pop.heal { color: var(--mint); text-shadow: 0 0 12px rgba(159, 224, 180, .5); }
.dmg-pop.buff { color: var(--blue); font-size: 32px; text-shadow: 0 0 12px rgba(143, 208, 240, .5); white-space: nowrap; }

/* Power-ups */
.side { display: grid; gap: 12px; min-width: 0; align-content: start; }
.kit { display: grid; gap: 8px; }
.items { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding-top: 6px; }
.item {
  position: relative; display: grid; justify-items: center; align-content: start; gap: 2px;
  min-height: 62px; padding: 8px 4px 6px;
  border: 2px dashed rgba(243, 239, 228, .42); border-radius: var(--wobble);
  background: rgba(0, 0, 0, .12); cursor: pointer;
  touch-action: manipulation;
}
.item:hover { background: rgba(243, 239, 228, .08); }
.item .ico { width: 30px; height: 30px; }
.item-name { font-size: 12.5px; font-weight: 700; color: var(--chalk-dim); line-height: 1.2; }
.item-count {
  position: absolute; top: -9px; right: -5px;
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
  display: grid; place-items: center;
  background: var(--chalk); color: var(--ink);
  font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.item.is-empty .ico, .item.is-empty .item-name { opacity: .4; }
.item.is-empty .item-count { background: var(--chalk-dim); }
.item.is-open { border-style: solid; border-color: var(--chalk); }
.item.is-active { border-style: solid; border-color: var(--yellow); background: rgba(245, 213, 97, .14); }
.item.is-active .item-name { color: var(--yellow); }
.item-info {
  display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center;
  padding: 10px 12px; border: 2px solid rgba(243, 239, 228, .5); border-radius: var(--wobble);
  background: rgba(0, 0, 0, .18);
}
.item-info > .ico { width: 34px; height: 34px; }
.item-text { display: grid; gap: 2px; flex: 1 1 170px; min-width: 0; font-size: 15px; line-height: 1.4; }
.item-text b { font-size: 17px; }
.item-why { color: var(--coral); }
.item-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.loot {
  display: flex; gap: 10px; align-items: center; text-align: left;
  padding: 8px 12px; border: 2px dashed var(--yellow); border-radius: var(--wobble);
  color: var(--yellow); font-weight: 700;
}
.loot .ico { width: 32px; height: 32px; }
.fighter.shielded::after {
  content: ""; position: absolute; left: 50%; top: 0; width: min(96%, 190px); aspect-ratio: 4 / 5;
  transform: translateX(-50%);
  border: 3px dashed var(--blue); border-radius: 50%;
  box-shadow: 0 0 18px rgba(143, 208, 240, .45), inset 0 0 22px rgba(143, 208, 240, .22);
  animation: shield-pulse 2.4s ease-in-out infinite; pointer-events: none;
}
.fighter.doubled::before {
  content: "×2"; position: absolute; left: 4%; top: 2%; z-index: 1;
  font: 700 24px var(--font-hand); color: var(--yellow); transform: rotate(-8deg);
  text-shadow: 0 0 10px rgba(245, 213, 97, .5);
}
@keyframes shield-pulse { 50% { opacity: .6; transform: translateX(-50%) scale(1.03); } }
.inv { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.inv > span:not(.eyebrow) { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-variant-numeric: tabular-nums; }
.inv .ico { width: 26px; height: 26px; }

.panel { display: grid; gap: 12px; min-width: 0; align-content: start; }
.spells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.spell {
  display: grid; justify-items: center; align-content: start; gap: 4px; text-align: center;
  padding: 12px 6px 10px;
  border: 2.5px solid var(--chalk); border-radius: var(--wobble);
  background: rgba(243, 239, 228, .04); cursor: pointer;
  transition: background .15s, transform .1s;
}
.spell:hover { background: rgba(243, 239, 228, .1); transform: translateY(-2px); }
.spell .ico { width: 42px; height: 42px; }
.spell-name { font: 400 22px var(--font-display); line-height: 1.1; }
.spell-power { font-weight: 700; font-size: 15px; color: var(--yellow); }
.spell-level { font-size: 13px; color: var(--chalk-dim); }

.puzzle { display: grid; gap: 12px; min-width: 0; }
.pz-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border: 1.5px solid rgba(243, 239, 228, .4); border-radius: 999px;
  font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--chalk-dim);
}
.tag .ico { width: 18px; height: 18px; }
.prompt { font-size: 19px; line-height: 1.45; max-width: 40em; }
.visual { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; min-width: 0; padding: 4px 0; }
.visual:empty { display: none; }
.pz-note { width: 100%; text-align: center; color: var(--chalk-dim); font-size: 16px; }
.pz-note b { color: var(--yellow); font-size: 20px; }

.seq { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip {
  min-width: 46px; padding: 6px 10px; text-align: center;
  border: 2px solid rgba(243, 239, 228, .55); border-radius: 10px 13px 9px 12px;
  font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.chip-q { border-color: var(--yellow); border-style: dashed; color: var(--yellow); }
.chip-op { border-color: var(--blue); color: var(--blue); }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
.arrow { color: var(--chalk-dim); font-size: 20px; }
.magic { display: grid; grid-template-columns: repeat(3, 58px); gap: 6px; }
.cell {
  height: 58px; display: grid; place-items: center;
  border: 2.5px solid var(--chalk); border-radius: 8px 10px 7px 11px;
  font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.cell-empty { border-style: dashed; border-color: rgba(243, 239, 228, .4); }
.cell-q { border-style: dashed; border-color: var(--yellow); color: var(--yellow); background: rgba(245, 213, 97, .1); }
.eqs { display: grid; gap: 8px; justify-items: start; }
.eq { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.eq .ico { width: 38px; height: 38px; }
.op { font-size: 24px; font-weight: 700; min-width: 16px; text-align: center; }
.num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.num-q { color: var(--yellow); }
.eq-ask { padding-top: 6px; border-top: 2px dashed rgba(243, 239, 228, .3); }
.facts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.fact { display: grid; justify-items: center; padding: 8px 16px; border: 2px solid rgba(243, 239, 228, .45); border-radius: var(--wobble); }
.fact b { font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fact span { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--chalk-dim); font-weight: 700; }
.week { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.wday { width: 36px; height: 36px; display: grid; place-items: center; border: 2px solid rgba(243, 239, 228, .4); border-radius: 50%; font-size: 14px; font-weight: 700; }
.wday-on { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.clock { width: 128px; height: 128px; }
.clock-face { fill: none; stroke: var(--chalk); stroke-width: 3; }

/* ---------- Motion ---------- */
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes hit { 0% { transform: translateX(0); filter: brightness(1); } 15% { transform: translateX(12px) rotate(5deg); filter: brightness(1.8); } 40% { transform: translateX(-9px) rotate(-3deg); } 65% { transform: translateX(5px); } 100% { transform: translateX(0); filter: brightness(1); } }

.is-lunge { animation: lunge .5s ease-in-out; }

/* ---------- Parent page ---------- */
:root { --viz-right: #4c98d8; --viz-wrong: #d6723e; --viz-grid: rgba(243, 239, 228, .16); }

<body>
<div class="app">
  <main class="board" id="board">
    <section class="screen title-screen"><div class="wrap"><h1 class="display title-word">Math Is <em>Magic</em></h1><p class="hand">Every spell is a puzzle. Solve it to cast it.</p></div></section>
  </main>
  <div class="ledge" aria-hidden="true"></div>
</div>
<div id="sr" class="sr-only" aria-live="polite"></div>
<script>
/* Math Is Magic: puzzle engine, part 1 (helpers, number patterns, magic squares) */
(function (root) {
  'use strict';
  const P = root.Puzzles = root.Puzzles || {};

  const rnd = {
    int(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },
    pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    },
    chance(p) { return Math.random() < p; }
  };
  P.rnd = rnd;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  P.esc = esc;

  // Friendly cast for story puzzles (Indonesian names: star, moon, rainbow, dew)
  P.NPCS = [
    { name: 'Wizard Bintang', he: 'He', his: 'his' },
    { name: 'Bulan the owl', he: 'She', his: 'her' },
    { name: 'Professor Pelangi', he: 'She', his: 'her' },
    { name: 'Embun the fox', he: 'He', his: 'his' }
  ];

  // HTML helpers. They return strings so the engine also runs in Node tests.
  const h = {
    seq(items) {
      return '<div class="seq">' + items.map(v =>
        v === '?' ? '<span class="chip chip-q">?</span>' : '<span class="chip">' + esc(v) + '</span>'
      ).join('') + '</div>';
    },
    expr(text) { return '<div class="expr">' + text + '</div>'; },

      lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, { type: 'triangle', vol: 0.09, at: i * 0.18 })),
      shield: () => [880, 1175].forEach((f, i) => tone(f, 0.3, { type: 'sine', vol: 0.09, at: i * 0.08 })),
      heal: () => [392, 523, 659, 880].forEach((f, i) => tone(f, 0.16, { type: 'sine', vol: 0.1, at: i * 0.07 })),
      power: () => tone(260, 0.45, { type: 'triangle', vol: 0.1, slide: 900 }),
      erase: () => noise(0.32, { freq: 2200, vol: 0.14 }),
      loot: () => [1319, 1568, 2093].forEach((f, i) => tone(f, 0.14, { type: 'triangle', vol: 0.07, at: 0.25 + i * 0.07 }))
    };
  })();

  /* ---------- Shared bits ---------- */
  const board = () => document.getElementById('board');
  const soundBtn = () => `<button class="icon-btn" data-act="sound" aria-pressed="${state.save.sound}" aria-label="Sound">${Art.icon(state.save.sound ? 'sound' : 'mute')}</button>`;
  const rateHTML = n => `<span class="rate" role="img" aria-label="${n} of 3 stars">${[0, 1, 2].map(i => Art.icon(i < n ? 'rate' : 'rate-empty')).join('')}</span>`;
  const totalStars = () => state.save.stars.reduce((a, b) => a + b, 0);
  const cleared = () => state.save.stars.filter(x => x > 0).length;
  const an = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;
  const nextStage = () => { const s = state.save; for (let i = 0; i < REALMS.length; i++) if (i < s.unlocked && !s.stars[i]) return i; return -1; };
  const myTitle = () => Jobs.title(state.save.job, cleared());
  const myIcon = () => (state.save.job ? Jobs.JOBS[state.save.job].icon : 'spark');
  const heroName = () => (state.save.hero.name || '').trim() || Art.DEFAULT_HERO.name || 'Mage';
  function say(text) { const sr = document.getElementById('sr'); if (sr) { sr.textContent = ''; setTimeout(() => { sr.textContent = text; }, 30); } }

  const SCRIBBLES = [
    ['1 + 2 + … + 100 = 5050', 3, 4, -5], ['3² + 4² = 5²', 72, 9, 5], ['7 × 8 = 56', 80, 46, -4], ['½ + ½ = 1', 4, 50, 3],
    ['π ≈ 3.14', 10, 86, -3], ['2, 3, 5, 7, 11, 13…', 56, 91, 4], ['9 × 9 = 81', 84, 72, -6]
  ].map(([t, x, y, r]) => `<span style="left:${x}%;top:${y}%;transform:rotate(${r}deg)">${t}</span>`).join('');

  /* ---------- Screens ---------- */
  const screens = {};

  screens.title = () => {
    const s = state.save;
    const actions = s.made
      ? `<p class="title-rank">${Art.icon(myIcon())}${esc(myTitle())}</p>
         <button class="btn btn-primary" data-act="toMap">Continue as ${esc(heroName())}</button>
         <button class="btn" data-act="toWardrobe">Change outfit</button>` +
        (state.confirmReset
          ? `<div class="confirm"><p>Start over? This erases every star.</p><div class="row" style="justify-content:center"><button class="btn btn-small" data-act="doReset">Yes, start over</button><button class="btn btn-small btn-ghost" data-act="cancelReset">Keep my stars</button></div></div>`
          : `<button class="btn btn-ghost" data-act="askReset">Start over</button>`)
      : `<button class="btn btn-primary" data-act="start">Start the adventure</button>`;
    return `<section class="screen title-screen" aria-labelledby="t-title"><div class="wrap">
      <div class="scribbles" aria-hidden="true">${SCRIBBLES}</div>
      <div class="title-top">${soundBtn()}</div>
      <p class="eyebrow">A chalkboard adventure</p>
      <h1 id="t-title" class="display title-word">Math Is <em>Magic</em></h1>
      <p class="hand">Every spell is a puzzle. Solve it to cast it.</p>
      <div class="title-art">${Art.mage(s.hero, 'idle')}${Art.monster('nolnaga', '', 'Nolnaga')}</div>
      <div class="title-actions">${actions}</div>
    </div></section>`;
  };

  function wardrobeOptions() {
    const H = state.save.hero;
    const sw = (key, val, bg, label) => `<button class="swatch" style="background:${bg}" data-act="set" data-arg="${key}:${val}" aria-pressed="${H[key] === val}" aria-label="${label}"></button>`;
    return `
      <div class="opt"><label class="opt-label" for="hero-name">Name</label>
        <input id="hero-name" class="name-input" maxlength="14" autocomplete="off" spellcheck="false" placeholder="Type your name" value="${esc(H.name)}"></div>
      <div class="opt"><span class="opt-label" id="lbl-gender">Gender</span>
        <div class="pills" role="group" aria-labelledby="lbl-gender">${[['girl', 'Girl'], ['boy', 'Boy']].map(([id, label]) => `<button class="pill" data-act="set" data-arg="gender:${id}" aria-pressed="${H.gender === id}">${label}</button>`).join('')}</div></div>
      <div class="opt"><span class="opt-label" id="lbl-robe">Robe</span>
        <div class="swatches" role="group" aria-labelledby="lbl-robe">${Art.ROBES.map(r => sw('robe', r, `var(--${r})`, `${r} robe`)).join('')}</div></div>
      <div class="opt"><span class="opt-label" id="lbl-hair">Hair</span>
        <div class="pills" role="group" aria-labelledby="lbl-hair">${Art.stylesFor(H.gender).map(st => `<button class="pill" data-act="set" data-arg="hair:${st.id}" aria-pressed="${H.hair === st.id}">${st.label}</button>`).join('')}</div></div>
      <div class="opt"><span class="opt-label" id="lbl-hc">${H.hair === 'hijab' ? 'Hijab colour' : 'Hair colour'}</span>
        <div class="swatches" role="group" aria-labelledby="lbl-hc">${Art.HAIR_COLORS.map((c, i) => sw('hairColor', c, c, HAIR_NAMES[i])).join('')}</div></div>
      <div class="opt"><span class="opt-label" id="lbl-skin">Skin</span>
        <div class="swatches" role="group" aria-labelledby="lbl-skin">${Art.SKINS.map((c, i) => sw('skin', c, c, SKIN_NAMES[i] + ' skin')).join('')}</div></div>
      <div class="opt"><span class="opt-label" id="lbl-extra">Extras</span>
        <div class="pills" role="group" aria-labelledby="lbl-extra">
          <button class="pill" data-act="toggle" data-arg="glasses" aria-pressed="${H.glasses}">Glasses</button>

      <div class="row"><button class="btn btn-primary" data-act="wardDone">${state.save.made ? 'Done' : 'Ready!'}</button></div>`;
  }

  screens.wardrobe = () => `<section class="screen" aria-labelledby="w-title"><div class="wrap">
      <div class="topbar"><button class="icon-btn" data-act="wardBack" aria-label="Back">${Art.icon('back')}</button><h2 id="w-title" class="h2 grow">Dress your mage</h2></div>
      <div class="ward">
        <div class="ward-preview" id="ward-preview">${Art.mage(state.save.hero, 'idle')}</div>
        <div class="ward-opts" id="ward-opts">${wardrobeOptions()}</div>
      </div></div></section>`;

  function refreshWardrobe() {
    const prev = document.getElementById('ward-preview');
    if (prev) prev.innerHTML = Art.mage(state.save.hero, 'idle');
    const H = state.save.hero;
    document.querySelectorAll('#ward-opts [data-act="set"]').forEach(b => {
      const [k, v] = b.dataset.arg.split(':');
      b.setAttribute('aria-pressed', String(H[k] === v));
    });
    document.querySelectorAll('#ward-opts [data-act="toggle"]').forEach(b => b.setAttribute('aria-pressed', String(!!H[b.dataset.arg])));
    const lbl = document.getElementById('lbl-hc');
    if (lbl) lbl.textContent = H.hair === 'hijab' ? 'Hijab colour' : 'Hair colour';
  }

  screens.map = () => {
    const s = state.save, total = totalStars(), max = REALMS.length * 3;
    const stop = (r, i) => {
      const open = i < s.unlocked, stars = s.stars[i];
      const cls = !open ? 'locked' : stars ? 'done' : '';
      const row = open
        ? `${rateHTML(stars)}<button class="btn btn-small ${stars ? '' : 'btn-primary'}" data-act="pickRealm" data-arg="${i}">${stars ? 'Play again' : 'Fight'}</button>`
        : `<span class="locked-note">${Art.icon('lock')} Beat realm ${i} first</span>`;
      return `<li class="stop ${cls}"><span class="stop-num" aria-hidden="true">${i + 1}</span>${Art.monster(r.monster, '', r.foe)}
        <div class="stop-info"><h4 class="h3">${r.name}</h4><p class="stop-meta">${r.foe} · ${r.hp} hit points${r.traits ? ' · ' + r.traits.map(t => TRAITS[t].name).join(', ') : ''}</p><div class="stop-row">${row}</div></div></li>`;
    };
    const chapters = CHAPTERS.map((c, ci) => {
      const open = c.first < s.unlocked;
      return `<section class="chapter${open ? '' : ' chapter-locked'}" aria-labelledby="ch-${ci}">
        <div class="chapter-head"><span class="eyebrow">Chapter ${ci + 1}</span><h3 id="ch-${ci}" class="h3">${c.title}</h3>
        ${open ? '' : `<p class="locked-note">${Art.icon('lock')} Beat Nolnaga to open this chapter</p>`}</div>
        <ol class="stops">${REALMS.slice(c.first, c.last + 1).map((r, j) => stop(r, c.first + j)).join('')}</ol></section>`;
    }).join('');
    const story = !s.champion
      ? 'Nolnaga, the Zero Devourer, has swallowed every zero in the kingdom! Beat the four monsters on the way, then face Nolnaga at Moonspire.'
      : !s.champion2
        ? 'The zeros are back! But Kakacau, the Star Scrambler, is mixing up the numbers in the sky. Beat the four monsters on the way, then face Kakacau at Starfall Observatory.'
        : `${esc(heroName())} is a Grand Mage! Play any realm again to collect every star.`;
    const c = cleared(), t = Jobs.tierFor(c), J = s.job ? Jobs.JOBS[s.job] : null, k = Jobs.skills(s.job, c);
    const me = `<div class="me-strip${s.jobPending ? ' is-pending' : ''}">${Art.icon(myIcon())}
      <div class="me-text"><b>${esc(heroName())} · ${esc(myTitle())}</b>
        <span>${J ? `${J.skill}: ${J.desc(t)}` : 'Clear stage 1 to choose your first job.'}</span>
        <span class="dim">${k.maxHearts} hearts · Skill level ${t}</span></div>
      ${c >= 1 ? `<button class="btn btn-small${s.jobPending ? ' btn-primary' : ''}" data-act="openJobs">${s.jobPending ? 'Choose your job' : 'Change job'}</button>` : ''}</div>`;
    return `<section class="screen" aria-labelledby="m-title"><div class="wrap wrap-narrow">
      <div class="topbar"><button class="icon-btn" data-act="toTitle" aria-label="Back to the title screen">${Art.icon('back')}</button>
        <h2 id="m-title" class="h2 grow">Kingdom of Numbers</h2>
        <span class="star-count" role="img" aria-label="${total} of ${max} stars">${Art.icon('rate')}${total}/${max}</span></div>
      <p class="story hand">${story}</p>
      ${me}
      <div class="inv" role="group" aria-label="Your power-ups"><span class="eyebrow">Power-ups</span>${Object.keys(window.MIM.ITEMS).map(id => `<span title="${window.MIM.ITEMS[id].name}">${Art.icon(window.MIM.ITEMS[id].icon)}<span class="sr-only">${window.MIM.ITEMS[id].name}</span>×${s.items[id] || 0}</span>`).join('')}</div>
      ${chapters}
      <div class="map-foot row"><button class="btn btn-small" data-act="openNotebook">${Art.icon('book')} Monster notebook</button><button class="btn btn-small" data-act="openParents">Parent page</button><button class="btn btn-small" data-act="toWardrobe">Change outfit</button>${soundBtn()}</div>
    </div></section>`;
  };

  screens.intro = () => {
    const r = REALMS[state.realm], s = state.save, c = cleared(), t = Jobs.tierFor(c), k = Jobs.skills(s.job, c), J = s.job ? Jobs.JOBS[s.job] : null;
    return `<section class="screen" aria-labelledby="i-title"><div class="wrap wrap-narrow">
      <div class="topbar"><button class="icon-btn" data-act="toMap" aria-label="Back to the map">${Art.icon('back')}</button><span class="eyebrow grow">Realm ${state.realm + 1} · ${r.name}</span></div>
      <div class="intro enter">${Art.monster(r.monster, 'idle', r.foe)}
        <h2 id="i-title" class="h2">${r.foe}</h2>
        <p class="beast-title">${r.title} · ${r.kind}</p>
        <p class="hand">${r.blurb}</p>
        <p class="weak-chip">${Art.icon('rate')}Weak spot: ${TOPICS[r.weak]} puzzles hit for +1</p>
        ${r.traits ? `<div class="traits"><p class="eyebrow">Special tricks</p>${r.traits.map(t => `<p class="trait">${Art.icon(TRAITS[t].icon)}<span><b>${TRAITS[t].name}.</b> ${TRAITS[t].text}</span></p>`).join('')}</div>` : ''}
        <ul class="rules">
          ${J ? `<li>${Art.icon(J.icon)}<span>You are ${an(esc(myTitle()))}. <b>${J.skill}:</b> ${J.desc(t)}</span></li>` : ''}
          <li>${Art.icon('spark')}<span>Pick a spell. Stronger spells hit harder but come with harder puzzles.</span></li>
          <li>${Art.icon('rate')}<span>Solve the puzzle to cast the spell. Three right in a row gives every spell +1 power until you miss.</span></li>
          <li>${Art.icon('heart')}<span>A wrong answer lets ${r.foe} hit back. You have ${k.maxHearts} hearts.</span></li>
          <li>${Art.icon('bulb')}<span>Stuck? A hint helps${k.freeHints ? ', and your job makes hints free.' : ', but the spell loses 1 power.'}</span></li>
          <li>${Art.icon('shield')}<span>Power-ups: you find one for every ${k.dropEvery} right answers in a row and for every win. Tap one in battle to see what it does.</span></li>
        </ul>
        <button class="btn btn-primary" data-act="fight">Fight ${r.foe}!</button>
      </div></div></section>`;
  };

  screens.result = () => {
    const res = state.result, r = REALMS[res.realm];
    if (res.won) {
      const next = res.realm + 1 < REALMS.length;
      const line = res.stars === 3 ? 'Perfect! You did not lose a single heart.'
        : res.stars === 2 ? 'Great work. You lost one heart.'
          : 'You did it! Win without losing a heart to earn all 3 stars.';
      return `<section class="screen" aria-labelledby="r-title"><div class="wrap wrap-narrow"><div class="result enter">
        <p class="eyebrow">Realm ${res.realm + 1} · ${r.name}</p>
        <h2 id="r-title" class="h2">${r.foe} is beaten!</h2>
        ${Art.mage(state.save.hero, 'idle')}
        ${rateHTML(res.stars)}
        <p class="fb-line">${line}</p>
        <p class="dim">${res.cast} spells cast · ${res.misses} ${res.misses === 1 ? 'mistake' : 'mistakes'}${res.hints ? ` · ${res.hints} ${res.hints === 1 ? 'hint' : 'hints'}` : ''}</p>
        ${res.returned && res.returned.length ? `<p class="loot">${Art.icon('rate')}<span>${r.foe} dropped everything it stole: ${res.returned.map(id => window.MIM.ITEMS[id].name).join(', ')}.</span></p>` : ''}
        ${res.drops && res.drops.length ? `<p class="loot">${Art.icon(window.MIM.ITEMS[res.drops[0]].icon)}<span>Victory prize${res.drops.length > 1 ? 's' : ''}: ${res.drops.map(id => window.MIM.ITEMS[id].a + ' ' + window.MIM.ITEMS[id].name).join(' and ')}!</span></p>` : ''}
        ${res.rankUp ? `<div class="rankup-note"><p class="eyebrow">Rank up!</p><p>${rankUpText(res.rankUp)}</p></div>` : ''}
        ${res.unlockedNow && next && !res.rankUp ? `<p class="hand">${REALMS[res.realm + 1].name} is open now.</p>` : ''}
        <div class="row">${res.rankUp ? '<button class="btn btn-primary" data-act="openJobs">Choose your job</button>'
          : next ? `<button class="btn btn-primary" data-act="pickRealm" data-arg="${res.realm + 1}">Next realm</button>` : ''}<button class="btn" data-act="toMap">Map</button></div>
      </div></div></section>`;
    }
    return `<section class="screen" aria-labelledby="r-title"><div class="wrap wrap-narrow"><div class="result lost enter">
      <p class="eyebrow">Realm ${res.realm + 1} · ${r.name}</p>
      <h2 id="r-title" class="h2">${r.foe} won this round</h2>
      ${Art.monster(r.monster, 'idle', r.foe)}
      <p class="fb-line">Every mistake showed you a new trick. Have another go!</p>
      <p class="dim">${res.cast} spells cast · ${r.foe} had ${res.hpLeft} of ${r.hp} hit points left</p>
      <div class="row"><button class="btn btn-primary" data-act="fight">Try again</button><button class="btn" data-act="toMap">Map</button></div>
    </div></div></section>`;
  };

  screens.final = () => {
    const date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    const ci = state.finalChapter || 0, ch = CHAPTERS[ci];
    const chStars = state.save.stars.slice(ch.first, ch.last + 1).reduce((a, b) => a + b, 0);
    return `<section class="screen" aria-labelledby="c-title"><div class="wrap wrap-narrow"><div class="cert enter">
      <p class="eyebrow">Certificate of Magic</p>
      ${Art.mage(state.save.hero, 'idle')}
      <p class="dim">This certifies that</p>
      <h2 id="c-title" class="cert-name">${esc(heroName())}</h2>
      <p class="fb-line">${ch.deed}</p>
      <p class="h3">${ch.rank}</p>
      <div class="cert-meta"><span>Chapter ${ci + 1}: ${ch.title}</span><span>${chStars} of 15 stars</span><span>${date}</span></div>
      <p class="cert-sign">Signed by Grandmage Bintang</p>
      ${ci === 0 ? `<p class="hand">A new adventure is waiting. Chapter 2, ${CHAPTERS[1].title}, is open!</p>
      <div class="row" style="justify-content:center">${state.save.jobPending ? '<button class="btn btn-primary" data-act="openJobs">Choose your job</button>' : `<button class="btn btn-primary" data-act="pickRealm" data-arg="${CHAPTERS[1].first}">Start Chapter 2</button>`}<button class="btn" data-act="toMap">Map</button></div>`
        : `<div class="row" style="justify-content:center">${state.save.jobPending ? '<button class="btn btn-primary" data-act="openJobs">See your Grand Mage powers</button>' : ''}<button class="btn${state.save.jobPending ? '' : ' btn-primary'}" data-act="toMap">Back to the map</button></div>`}
    </div></div></section>`;
  };

  function rankUpText(ru) {
    const bits = [];
    const newJobs = Jobs.ORDER.filter(id => Jobs.JOBS[id].unlock === ru.after).map(id => Jobs.JOBS[id].school);
    if (ru.after >= REALMS.length) return 'You are a Grand Mage now, the highest rank of all!';
    if (ru.before === 0) bits.push('You are not a trainee any more. Time to choose a job!');
    if (newJobs.length && ru.before > 0) bits.push(`New job unlocked: ${newJobs.join(', ')}.`);
    if (Jobs.tierFor(ru.after) > Jobs.tierFor(ru.before)) bits.push(`Your skills grow to level ${Jobs.tierFor(ru.after)}.`);
    if (Jobs.baseHearts(ru.after) > Jobs.baseHearts(ru.before)) bits.push(`You now have ${Jobs.baseHearts(ru.after)} hearts.`);
    if (!bits.length) bits.push('You can pick a new job for the next stage, or keep your current one.');
    return bits.join(' ');
  }

  /* ---------- Monster notebook ---------- */
  screens.notebook = () => {
    const s = state.save;
    const cards = REALMS.map((r, i) => {
      if (i >= s.unlocked) {
        return `<article class="beast is-unknown">${Art.monster(r.monster, 'silhouette', 'Unknown monster')}
          <div class="beast-info"><p class="eyebrow">Stage ${i + 1}</p><h3 class="h3">???</h3><p class="dim">Reach stage ${i + 1} to learn about this monster.</p></div></article>`;
      }
      const n = s.beaten[i] || 0;
      const tricks = (r.traits || []).map(t => `<li><b>${TRAITS[t].name}.</b> ${TRAITS[t].text}</li>`).join('');
      return `<article class="beast">${Art.monster(r.monster, '', r.foe)}
        <div class="beast-info">
          <p class="eyebrow">${r.kind} · Stage ${i + 1}</p>
          <h3 class="h3">${r.foe}</h3><p class="beast-title">${r.title}</p>
          <dl class="beast-facts">
            <div><dt>Habitat</dt><dd>${r.name}</dd></div>
            <div><dt>Hit points</dt><dd>${r.hp}</dd></div>
            <div><dt>Weak spot</dt><dd>${TOPICS[r.weak]} puzzles (+1 damage)</dd></div>
            <div><dt>Beaten</dt><dd>${n ? `${n} time${n === 1 ? '' : 's'}` : 'Not yet'}${n ? ' ' + rateHTML(s.stars[i]) : ''}</dd></div>
          </dl>
          ${tricks ? `<ul class="beast-tricks">${tricks}</ul>` : ''}
          <p class="beast-origin">Name ${r.origin}.</p>
        </div></article>`;
    }).join('');
    return `<section class="screen" aria-labelledby="n-title"><div class="wrap wrap-narrow">
      <div class="topbar"><button class="icon-btn" data-act="toMap" aria-label="Back to the map">${Art.icon('back')}</button><h2 id="n-title" class="h2 grow">Monster notebook</h2></div>
      <p class="dim">Every monster has a weak spot. Solve a puzzle of that kind and your spell hits for 1 extra damage.</p>
      <div class="beasts">${cards}</div>
    </div></section>`;
  };

  /* ---------- Job Hall ---------- */
  screens.jobs = () => {
    const s = state.save, c = cleared(), t = Jobs.tierFor(c), k = Jobs.skills(s.job, c);
    const ids = (c >= REALMS.length ? ['grand'] : []).concat(Jobs.ORDER);
    const nextTier = c < 3 ? 3 : c < 5 ? 5 : c < 8 ? 8 : null;
    const cards = ids.map(id => {
      const J = Jobs.JOBS[id], locked = c < J.unlock, cur = s.job === id, name = J.titles[t - 1];
      const action = locked ? `<p class="locked-note">${Art.icon('lock')} Unlocks after stage ${J.unlock}</p>`
        : cur ? '<p class="job-current">Your job</p>'
          : `<button class="btn btn-small" data-act="pickJob" data-arg="${id}">Choose ${name}</button>`;
      return `<article class="job job-${id}${cur ? ' is-current' : ''}${locked ? ' is-locked' : ''}">

        <p class="job-skill">${locked ? J.blurb : `<b>${J.skill}.</b> ${J.desc(t)}`}</p>
        ${!locked && nextTier && id !== 'grand' ? `<p class="job-next">Becomes ${J.titles[Jobs.tierFor(nextTier) - 1]} after stage ${nextTier}</p>` : ''}
        ${action}</article>`;
    }).join('');
    const ns = nextStage();
    const cta = s.job
      ? `<button class="btn btn-primary" data-act="jobsDone">${ns >= 0 ? `Next stage: ${REALMS[ns].name}` : 'Back to the map'}</button>`

      why: b => b.phase !== 'puzzle' ? 'Pick a spell first, then use it on the puzzle.' : '' }
  };
  const ITEM_IDS = Object.keys(ITEMS);
  M.ITEMS = ITEMS;
  const inv = () => state.save.items;

  function grantRandom() {
    const bag = inv();
    const open = ITEM_IDS.filter(id => (bag[id] || 0) < MAX_ITEM);
    if (!open.length) return null;
    const id = Pz.rnd.pick(open);
    bag[id] = (bag[id] || 0) + 1;
    M.persist();
    return id;
  }
  function blocked(id) {
    const b = state.battle;
    if (!b) return 'Power-ups only work in battles.';
    if ((inv()[id] || 0) < 1) return `You have none left. Get ${b.k.dropEvery} right in a row to find more.`;
    if (b.phase === 'feedback' || b.busy) return 'Wait for your next spell.';
    return ITEMS[id].why(b);
  }

  function newBattle(realm) {
    const r = REALMS[realm], k = window.Jobs.skills(state.save.job, M.cleared());
    state.battle = {
      realm, hp: r.hp, hearts: k.maxHearts, maxHearts: k.maxHearts, k, streak: 0, recent: [],
      phase: 'spell', spell: 0, puzzle: null, hintUsed: false, input: '', choice: null,
      cast: 0, misses: 0, hints: 0, last: null, busy: false,
      shield: k.shieldStart, double: k.startDouble, info: null, stolen: [],
      swaps: k.swaps, rewinds: k.rewinds
    };
  }

  function makePuzzle(spell) {
    const b = state.battle, r = REALMS[b.realm];
    let pool = r.pool.filter(t => !b.recent.includes(t));
    if (!pool.length) pool = r.pool;
    const type = Pz.rnd.pick(pool);
    b.recent.push(type);
    while (b.recent.length > Math.min(3, r.pool.length - 1)) b.recent.shift();
    return Pz.make(type, r.tiers[spell], { name: M.heroName(), he: state.save.hero.gender === 'boy' ? 'He' : 'She' });
  }

  const has = trait => (REALMS[state.battle.realm].traits || []).includes(trait);
  const basePower = (spell, hint) => {
    const b = state.battle;
    return Math.max(1, SPELLS[spell].power + (b.streak >= 2 ? 1 : 0) - (hint && !b.k.freeHints ? 1 : 0)) + b.k.dmg;
  };
  // Spell names, icons and colours come from the job's spellbook; power comes from the slot
  const SP = i => Object.assign({}, SPELLS[i], window.Jobs.spells(state.save.job)[i]);
  const weakBonus = () => (state.battle.puzzle && state.battle.puzzle.type === REALMS[state.battle.realm].weak ? 1 : 0);
  const power = () => basePower(state.battle.spell, state.battle.hintUsed) * (state.battle.double ? 2 : 1) + weakBonus();

  /* ---------- Pieces ---------- */
  function heartsHTML() {
    const b = state.battle;
    let out = '';
    for (let i = 0; i < b.maxHearts; i++) out += Art.icon(i < b.hearts ? 'heart' : 'heart-empty');
    return out;
  }
  function statusHTML() {
    const b = state.battle, chips = [];
    if (b.shield > 0) chips.push(`<span class="chip-s" title="Shields">${Art.icon('shield')}×${b.shield}</span>`);
    if (b.k.swaps) chips.push(`<span class="chip-s" title="Free puzzle swaps">${Art.icon('book')}×${b.swaps}</span>`);
    if (b.k.rewinds) chips.push(`<span class="chip-s" title="Rewinds">${Art.icon('hourglass')}×${b.rewinds}</span>`);
    return chips.join('');
  }
  function tallyHTML() {
    const b = state.battle, max = REALMS[b.realm].hp;
    let lines = '';
    for (let i = 0; i < max; i++) {
      const g = Math.floor(i / 5), pos = i % 5, x0 = 4 + g * 38;
      const cls = i < b.hp ? 'on' : 'off';
      lines += pos < 4
        ? `<line class="${cls}" x1="${x0 + pos * 7}" y1="4" x2="${x0 + pos * 7}" y2="22"/>`
        : `<line class="${cls}" x1="${x0 - 4}" y1="19" x2="${x0 + 25}" y2="7"/>`;
    }
    const w = 4 + Math.ceil(max / 5) * 38;
    return `<svg class="tally" id="tally" viewBox="0 0 ${w} 26" role="img" aria-label="${b.hp} of ${max} hit points left" style="max-width:${w * 1.15}px">${lines}</svg>`;
  }
  const comboText = () => state.battle.streak >= 3 ? `${state.battle.streak} in a row! +1 power` : state.battle.streak === 2 ? 'One more for a combo!' : '';
  const mageClass = () => 'fighter' + (state.battle.shield ? ' shielded' : '') + (state.battle.double ? ' doubled' : '');

  function kitHTML() {
    const b = state.battle, bag = inv();
    const buttons = ITEM_IDS.map(id => {
      const it = ITEMS[id], n = bag[id] || 0;
      const active = (id === 'shield' && b.shield) || (id === 'double' && b.double);
      const cls = 'item' + (active ? ' is-active' : '') + (b.info === id ? ' is-open' : '') + (n || active ? '' : ' is-empty');
      return `<button class="${cls}" data-act="itemInfo" data-arg="${id}" aria-expanded="${b.info === id}" aria-label="${it.name}: ${n} left${active ? ', in use' : ''}">` +
        `${Art.icon(it.icon)}<span class="item-name">${it.short}</span><span class="item-count">${n}</span></button>`;
    }).join('');
    let info = '';
    if (b.info) {
      const it = ITEMS[b.info], why = blocked(b.info);
      info = `<div class="item-info enter">${Art.icon(it.icon)}<div class="item-text"><b>${it.name}</b><span>${it.what}</span>${why ? `<span class="item-why">${why}</span>` : ''}</div>` +
        `<div class="item-btns">${why ? '' : `<button class="btn btn-primary btn-small" data-act="useItem" data-arg="${b.info}">Use it</button>`}<button class="btn btn-ghost btn-small" data-act="itemInfo" data-arg="">Close</button></div></div>`;
    }
    return `<div class="items" role="group" aria-label="Power-ups">${buttons}</div>${info}`;
  }

  function spellHTML() {
    const b = state.battle, r = REALMS[b.realm];
    const notes = [];
    if (b.double) notes.push('Double Chalk is ready, so your next correct spell hits twice as hard.');
    if (b.streak >= 2) notes.push('Combo! Every spell gets +1 power.');
    if (has('armored')) notes.push(`${r.foe} is armoured, so ${SP(0).name} bounces off.`);
    return `<div class="enter"><h3 class="h3">Choose a spell</h3><p class="dim">Stronger spells hit harder, but their puzzles are tougher.</p>${notes.map(n => `<p class="hand">${n}</p>`).join('')}</div>
      <div class="spells enter">${SPELLS.map((_, i) => {
        const s = SP(i), bounce = i === 0 && has('armored');
        return `<button class="spell" data-act="chooseSpell" data-arg="${i}"${bounce ? ' disabled' : ''}>${Art.icon(s.icon)}<span class="spell-name">${s.name}</span><span class="spell-power">${bounce ? 'Bounces off' : (basePower(i, false) * (b.double ? 2 : 1)) + ' power'}</span><span class="spell-level">Level ${r.tiers[i]}</span></button>`;
      }).join('')}</div>`;
  }

  function answerHTML() {
    const b = state.battle, p = b.puzzle;
    if (p.input === 'number') {
      const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="key" data-act="key" data-arg="${n}">${n}</button>`).join('');
      return `<div class="answer-box" id="answer-box" role="status" aria-label="Your answer">${b.input ? esc(b.input) : '<span class="placeholder">Type your answer</span>'}<span class="caret" aria-hidden="true"></span></div>
        <div class="keypad" role="group" aria-label="Number pad">${keys}
          <button class="key" data-act="key" data-arg="del" aria-label="Delete">${Art.icon('back')}</button>
          <button class="key" data-act="key" data-arg="0">0</button>
          <button class="key key-cast" id="cast-btn" data-act="cast" ${b.input ? '' : 'disabled'}>Cast!</button></div>`;
    }
    const style = p.choiceStyle === 'days' ? 'days' : p.choiceStyle === 'tiles' ? 'tiles-choice' : '';
    return `<div class="choices ${style}" role="group" aria-label="Answers">${p.choices.map(c =>
      `<button class="choice" data-act="choose" data-arg="${c.id}" aria-pressed="${b.choice === c.id}" aria-label="${esc(c.aria)}">${c.svg || esc(c.label)}</button>`).join('')}</div>
      <button class="btn btn-primary" id="cast-btn" data-act="cast" ${b.choice === null ? 'disabled' : ''}>Cast!</button>`;
  }

  function puzzleHTML() {
    const b = state.battle, p = b.puzzle, s = SP(b.spell);
    const pw = power();
    const loss = pw - (basePower(b.spell, true) * (b.double ? 2 : 1) + weakBonus());
    const hintBtn = b.hintUsed ? '' : has('gusty') ? `<p class="hand">The wind blows hints away in this fight.</p>` :
      `<button class="btn btn-ghost btn-small" data-act="hint">${Art.icon('bulb')} Show a hint${loss > 0 ? ` (−${loss} power)` : ''}</button>`;
    return `<div class="puzzle enter">
      <div class="pz-head"><span class="tag">${Art.icon(s.icon)} ${s.name} · ${pw} power${b.streak >= 2 ? ' · combo' : ''}${b.double ? ' · ×2' : ''}</span><span class="tag">${esc(p.label)} · Level ${p.tier}</span>${weakBonus() ? '<span class="tag tag-weak">Weak spot! +1</span>' : ''}</div>
      <p class="prompt">${esc(p.prompt)}</p>
      <div class="visual">${p.html}</div>
      ${b.hintUsed ? `<div class="hint-note">${Art.icon('bulb')}<p class="hand">${esc(p.hint)}</p></div>` : ''}
      <div class="answer" id="answer">${answerHTML()}</div>
      ${hintBtn || b.k.swaps ? `<div class="pz-actions">${hintBtn}${b.k.swaps ? `<button class="btn btn-ghost btn-small" data-act="swap"${b.swaps ? '' : ' disabled'}>${Art.icon('book')} Swap puzzle (${b.swaps} left)</button>` : ''}</div>` : ''}
    </div>`;
  }

  function feedbackHTML() {
    const b = state.battle, p = b.puzzle, r = REALMS[b.realm], L = b.last, s = SP(b.spell);
    if (L.rewound) {
      return `<div class="feedback rewind enter">
        <h3 class="fb-title">${L.title}</h3>
        <p class="fb-line">That answer was not right, but your Rewind skill turned back time before ${r.foe} could hit you. Have another go at the same puzzle.${b.rewinds ? ` (${b.rewinds} rewind${b.rewinds === 1 ? '' : 's'} left)` : ''}</p>
        <button class="btn btn-primary" id="next-btn" data-act="retry">Try again</button>
      </div>`;
    }
    let line;
    if (L.ok) {
      const helpers = [];
      if (L.weak) helpers.push('its weak spot');
      if (L.doubled) helpers.push('Double Chalk');
      if (L.bonus) helpers.push('your combo');
      line = `${s.name} hits ${r.foe} for ${L.dmg}${helpers.length ? `, thanks to ${helpers.join(' and ')}` : ''}.` + (b.hp === 0 ? ` ${r.foe} is beaten!` : '') +
        (L.healed ? ' Your Mend skill heals 1 heart.' : '') + (L.shieldUp ? ' Your Ward skill raises a new shield.' : '');
    } else {
      const picked = p.input === 'number' ? null : (p.choices.find(c => c.id === L.given) || {}).aria || '';
      const given = p.input === 'number' ? L.given : (p.choiceStyle === 'tiles' ? 'the ' + picked : picked);
      line = `You answered ${esc(given)}, but the answer is ${esc(Pz.answerText(p))}. ` +
        (L.blocked ? `${r.foe} hits back, but your shield blocks it. No heart lost!`
          : `${r.foe} hits back and you lose a heart.` + (b.hearts === 0 ? ' That was your last heart.' : '')) +
        (L.stole ? ` ${r.foe} snatches your ${ITEMS[L.stole].name}!` : '') +
        (L.regrew ? ` ${r.foe} regrows 1 hit point.` : '');
    }
    const loot = L.drop ? `<p class="loot">${Art.icon(ITEMS[L.drop].icon)}<span>${L.streak} in a row! You found ${ITEMS[L.drop].a} ${ITEMS[L.drop].name}.</span></p>` : '';
    const btn = b.hp === 0 ? 'Claim victory' : b.hearts === 0 ? 'Continue' : 'Next spell';
    return `<div class="feedback ${L.ok ? 'good' : 'bad'} enter">
      <h3 class="fb-title">${L.title}</h3>
      <p class="fb-line">${line}</p>
      ${loot}
      <div class="fb-explain"><span class="eyebrow">${L.ok ? 'The trick' : 'How to solve it'}</span>${esc(p.explain)}</div>
      <button class="btn btn-primary" id="next-btn" data-act="next">${btn}</button>
    </div>`;
  }

  function panelHTML() {
    const ph = state.battle.phase;
    return ph === 'spell' ? spellHTML() : ph === 'puzzle' ? puzzleHTML() : feedbackHTML();
  }

  M.screens.battle = () => {
    const b = state.battle, r = REALMS[b.realm], H = state.save.hero;
    const foeCls = b.hp === 0 ? 'is-beaten' : 'idle';
    return `<section class="screen battle" id="battle-screen" aria-labelledby="b-title"><div class="wrap">
      <div class="topbar">
        <button class="icon-btn" data-act="quitBattle" aria-label="Leave the battle">${Art.icon('back')}</button>
        <div class="grow"><p class="eyebrow">Realm ${b.realm + 1}</p><h2 id="b-title" class="realm-name">${r.name}</h2></div>
        ${M.soundBtn()}
      </div>
      <div class="battle-body">
        <div class="side">
          <div class="arena" id="arena">
            <div class="${mageClass()}" id="f-mage">${Art.mage(H, 'idle')}<span class="fighter-name">${esc(M.heroName())}</span><span class="job-title">${Art.icon(M.myIcon())}${esc(M.myTitle())}</span><div class="hearts${b.maxHearts > 4 ? ' many' : ''}" id="hearts" role="img" aria-label="${b.hearts} of ${b.maxHearts} hearts">${heartsHTML()}</div><div class="status" id="status">${statusHTML()}</div></div>
            <div class="fighter" id="f-foe">${Art.monster(r.monster, foeCls, r.foe)}<span class="fighter-name">${r.foe}</span>${tallyHTML()}<div class="trait-tags">${(r.traits || []).map(t => `<span class="trait-tag">${M.TRAITS[t].name}</span>`).join('')}<span class="trait-tag weak-tag">Weak: ${M.TOPICS[r.weak]}</span></div></div>
            <div class="combo" id="combo">${comboText()}</div>
          </div>
          <div class="kit" id="kit">${kitHTML()}</div>
        </div>
        <div class="panel" id="panel">${panelHTML()}</div>
      </div>
    </div></section>`;
  };

  /* ---------- Partial updates ---------- */
  function refreshPanel(scroll) {
    const panel = $('panel');
    if (!panel) return;
    panel.innerHTML = panelHTML();
    if (scroll) {
      const sc = $('battle-screen');
      if (sc && window.innerWidth < 860) {
        const top = panel.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 8;
        if (scroll === 'panel' || sc.scrollTop > top) sc.scrollTo({ top: Math.max(0, top), behavior: reduced() ? 'auto' : 'smooth' });
      }
    }
  }
  function refreshKit() { const kit = $('kit'); if (kit) kit.innerHTML = kitHTML(); }
  function refreshStatus() {
    const b = state.battle;
    const hearts = $('hearts');
    if (hearts) { hearts.innerHTML = heartsHTML(); hearts.setAttribute('aria-label', `${b.hearts} of ${b.maxHearts} hearts`); }
    const status = $('status');
    if (status) status.innerHTML = statusHTML();
    const tally = $('tally');
    if (tally) tally.outerHTML = tallyHTML();
    const combo = $('combo');
    if (combo) combo.textContent = comboText();
    const mage = $('f-mage');
    if (mage) mage.className = mageClass();
  }
  function refreshAnswer() {
    const b = state.battle, box = $('answer-box'), btn = $('cast-btn');
    if (box) box.innerHTML = (b.input ? esc(b.input) : '<span class="placeholder">Type your answer</span>') + '<span class="caret" aria-hidden="true"></span>';
    if (btn) btn.disabled = b.puzzle.input === 'number' ? !b.input : b.choice === null;
    document.querySelectorAll('#answer .choice').forEach(c => c.setAttribute('aria-pressed', String(Number(c.dataset.arg) === b.choice)));
  }

  /* ---------- Animation helpers ---------- */
  function restart(el, cls) {
    if (!el) return;
    el.classList.remove(cls, 'idle');
    void el.getBoundingClientRect();
    el.classList.add(cls);
    el.addEventListener('animationend', function done(ev) {
      if (ev.target !== el) return;
      el.classList.remove(cls);
      if (!el.classList.contains('is-beaten')) el.classList.add('idle');
      el.removeEventListener('animationend', done);
    });
  }
  function pop(text, target, kind) {
    const arena = $('arena');
    if (!arena || !target) return;
    const a = arena.getBoundingClientRect(), t = target.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'dmg-pop' + (kind ? ' ' + kind : '');
    el.textContent = text;
    el.style.left = (t.left - a.left + t.width * 0.36) + 'px';
    el.style.top = (t.top - a.top + t.height * 0.12) + 'px';
    arena.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }
  function bolt(color, width, done) {
    const arena = $('arena'), mage = document.querySelector('#f-mage .mage'), foe = document.querySelector('#f-foe .monster');
    if (!arena || !mage || !foe || reduced() || !Element.prototype.animate) { done(); return; }
    const a = arena.getBoundingClientRect(), m = mage.getBoundingClientRect(), f = foe.getBoundingClientRect();
    const x1 = m.left - a.left + m.width * 0.94, y1 = m.top - a.top + m.height * 0.22;
    const x2 = f.left - a.left + f.width * 0.42, y2 = f.top - a.top + f.height * 0.5;
    const cy = Math.min(y1, y2) - Math.max(40, a.height * 0.25);
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'bolt'); svg.setAttribute('viewBox', `0 0 ${a.width} ${a.height}`); svg.setAttribute('aria-hidden', 'true');
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', `M${x1} ${y1} Q${(x1 + x2) / 2} ${cy} ${x2} ${y2}`);
    path.setAttribute('pathLength', '1');
    path.setAttribute('filter', 'url(#chalk)');
    path.style.cssText = `stroke:${color};stroke-width:${width};stroke-dasharray:1;stroke-dashoffset:1`;
    svg.appendChild(path); arena.appendChild(svg);
    const anim = path.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 420, easing: 'ease-in', fill: 'forwards' });
    anim.onfinish = () => {
      done();
      const fade = svg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
      fade.onfinish = () => svg.remove();
    };
  }

  function playHit(dmg, doubled) {
    const b = state.battle, mage = document.querySelector('#f-mage .mage'), foe = document.querySelector('#f-foe .monster');
    restart(mage, 'is-cast');
    sfx.cast(SPELLS[b.spell].power);
    bolt(doubled ? 'var(--chalk)' : SP(b.spell).color, 4 + Math.min(dmg, 8) * 2, () => {
      sfx.hit();
      if (b.hp === 0 && foe) { foe.classList.remove('idle'); foe.classList.add('is-beaten'); }
      else restart(foe, 'is-hit');
      pop('−' + dmg, foe, '');
      refreshStatus();
    });
  }
  function playAttack(shielded, regrew, stole) {
    const mage = document.querySelector('#f-mage .mage'), foe = document.querySelector('#f-foe .monster');
    restart(foe, 'is-lunge');
    setTimeout(() => {
      if (shielded) { sfx.shield(); pop('Blocked!', mage, 'buff'); }
      else { sfx.hit(); restart(mage, 'is-hurt'); pop('−1', mage, 'hurt'); }
      refreshStatus();
    }, reduced() ? 0 : 260);
    if (regrew || stole) setTimeout(() => {
      if (regrew) { sfx.heal(); pop('+1', foe, 'heal'); }
      else { sfx.erase(); pop('Snatch!', foe, 'buff'); }
      refreshStatus(); refreshKit();
    }, reduced() ? 0 : 700);
  }

  /* ---------- Turn logic ---------- */
  function chooseSpell(i) {
    const b = state.battle;
    if (b.phase !== 'spell' || b.busy || (i === 0 && has('armored'))) return;
    b.spell = i; b.puzzle = makePuzzle(i);
    b.hintUsed = false; b.input = ''; b.choice = null; b.phase = 'puzzle';
    if (b.info && b.info !== 'eraser') b.info = null;
    refreshPanel('panel'); refreshKit();
  }
  function press(k) {
    const b = state.battle;
    if (b.phase !== 'puzzle' || b.puzzle.input !== 'number' || b.busy) return;
    if (k === 'del') b.input = b.input.slice(0, -1);
    else if (b.input.length < 5) b.input = b.input === '0' ? k : b.input + k;
    refreshAnswer();
  }
  function choose(id) {
    const b = state.battle;
    if (b.phase !== 'puzzle' || b.puzzle.input !== 'choice' || b.busy) return;
    b.choice = id; refreshAnswer();
  }
  function cast() {
    const b = state.battle;
    if (!b || b.phase !== 'puzzle' || b.busy) return;
    const p = b.puzzle;
    const val = p.input === 'number' ? b.input : b.choice;
    if (val === '' || val === null) return;
    const ok = Pz.check(p, p.input === 'number' ? Number(val) : val);
    if (M.track) M.track(p, ok, val, b.hintUsed);
    b.cast++; b.info = null;
    if (ok) {
      const doubled = b.double, dmg = power(), bonus = b.streak >= 2, weak = weakBonus() > 0;
      b.double = false;
      b.streak++;
      b.hp = Math.max(0, b.hp - dmg);
      const drop = b.streak % b.k.dropEvery === 0 ? grantRandom() : null;
      let healed = false, shieldUp = false;
      if (b.k.healEvery && b.streak % b.k.healEvery === 0 && b.hearts < b.maxHearts && b.hp > 0) { b.hearts++; healed = true; }
      if (b.k.shieldOnStreak && b.streak % 3 === 0 && b.shield < 3 && b.hp > 0) { b.shield++; shieldUp = true; }
      b.last = { ok: true, dmg, bonus, doubled, weak, drop, healed, shieldUp, streak: b.streak, given: val, title: Pz.rnd.pick(PRAISE) };
      sfx.correct();
      if (drop) sfx.loot();
      playHit(dmg, doubled);
      M.say(`Correct! ${SP(b.spell).name} hits for ${dmg}.` + (drop ? ` You found ${ITEMS[drop].a} ${ITEMS[drop].name}.` : ''));
    } else if (b.rewinds > 0) {
      b.rewinds--;
      if (!b.k.rewindKeepsCombo) b.streak = 0;
      b.last = { ok: false, rewound: true, given: val, title: 'Time rewinds!' };
      sfx.power();
      pop('Rewind!', document.querySelector('#f-mage .mage'), 'buff');
      M.say('Not quite, but time rewinds. Try the same puzzle again.');
      refreshStatus();
    } else {
      const shielded = b.shield > 0;
      b.streak = 0; b.misses++;
      if (shielded) b.shield--; else b.hearts = Math.max(0, b.hearts - 1);
      let regrew = false, stole = null;
      if (has('regrow') && b.hp < REALMS[b.realm].hp) { b.hp += 1; regrew = true; }
      if (has('thief') && !shielded) {
        const bag = inv(), owned = ITEM_IDS.filter(id => (bag[id] || 0) > 0);
        if (owned.length) { stole = Pz.rnd.pick(owned); bag[stole]--; b.stolen.push(stole); M.persist(); }
      }
      b.last = { ok: false, blocked: shielded, regrew, stole, given: val, title: 'Not quite' };
      sfx.wrong();
      playAttack(shielded, regrew, stole);
      M.say(`Not quite. The answer is ${Pz.answerText(p)}.` + (shielded ? ' Your shield blocked the hit.' : ''));
    }
    b.phase = 'feedback';
    b.busy = true;
    setTimeout(() => { b.busy = false; refreshKit(); }, reduced() ? 0 : 450);
    refreshPanel('panel'); refreshKit();
  }
  function next() {
    const b = state.battle;
    if (!b || b.phase !== 'feedback' || b.busy) return;
    if (b.last && b.last.rewound) return retry();
    if (b.hp === 0) return finish(true);
    if (b.hearts === 0) return finish(false);
    b.phase = 'spell'; b.puzzle = null; b.info = null;
    refreshPanel('panel'); refreshKit();
  }
  function retry() {
    const b = state.battle;
    if (!b || b.phase !== 'feedback' || !b.last || !b.last.rewound) return;
    b.phase = 'puzzle'; b.input = ''; b.choice = null; b.last = null;
    refreshPanel('panel'); refreshKit();
  }
  function swap() {
    const b = state.battle;
    if (!b || b.phase !== 'puzzle' || b.busy || b.swaps < 1) return;
    b.swaps--;
    b.puzzle = makePuzzle(b.spell); b.hintUsed = false; b.input = ''; b.choice = null;
    sfx.erase();
    M.say('Here is a new puzzle.');
    refreshPanel('panel'); refreshStatus();
  }
  function useItem(id) {
    const b = state.battle;
    if (!b || !ITEMS[id] || blocked(id)) return;
    inv()[id]--;
    M.persist();
    b.info = null;
    const mage = document.querySelector('#f-mage .mage');
    if (id === 'shield') { b.shield = Math.min(3, b.shield + 1); sfx.shield(); pop('Shield!', mage, 'buff'); M.say('Shield Charm is up. It blocks the next hit.'); }
    if (id === 'jamu') { b.hearts = Math.min(b.maxHearts, b.hearts + 1); sfx.heal(); pop('+1', mage, 'heal'); M.say('Jamu Potion. You got a heart back.'); }
    if (id === 'double') { b.double = true; sfx.power(); pop('×2', mage, ''); M.say('Double Chalk is ready for your next correct spell.'); }
    if (id === 'eraser') { b.puzzle = makePuzzle(b.spell); b.hintUsed = false; b.input = ''; b.choice = null; sfx.erase(); M.say('The board is wiped. Here is a new puzzle.'); }
    refreshStatus();
    refreshKit();
    if (id === 'eraser' || id === 'double') refreshPanel(id === 'eraser' ? 'panel' : false);
  }
  function finish(won) {
    const b = state.battle, s = state.save, i = b.realm;
    let unlockedNow = false, firstWin = false, rankUp = null;
    const drops = [], before = M.cleared(), stars = Math.max(1, 3 - (b.maxHearts - b.hearts));
    if (won) {
      s.stars[i] = Math.max(s.stars[i], stars);
      s.beaten[i] = (s.beaten[i] || 0) + 1;
      if (i + 1 < REALMS.length && s.unlocked < i + 2) { s.unlocked = i + 2; unlockedNow = true; }
      const ci = M.CHAPTERS.findIndex(c => c.last === i);
      if (ci >= 0 && !s[M.CHAPTERS[ci].key]) {
        s[M.CHAPTERS[ci].key] = true; firstWin = true; state.finalChapter = ci;
        if (ci + 1 < M.CHAPTERS.length && s.unlocked < M.CHAPTERS[ci + 1].first + 1) s.unlocked = M.CHAPTERS[ci + 1].first + 1;
      }
      b.stolen.forEach(id => { inv()[id] = Math.min(MAX_ITEM, (inv()[id] || 0) + 1); });
      for (let n = 0; n < b.k.prizes; n++) { const d = grantRandom(); if (d) drops.push(d); }
      const after = M.cleared();
      if (after > before) {
        s.jobPending = true;
        if (after >= REALMS.length) s.job = 'grand';
        rankUp = { before, after };
      }
      sfx.win();
    } else sfx.lose();
    M.persist();
    state.result = { realm: i, won, stars: won ? stars : 0, cast: b.cast, misses: b.misses, hints: b.hints, hpLeft: b.hp, unlockedNow, drops, rankUp, returned: won ? b.stolen.slice() : [] };
    state.battle = null;
    M.go(firstWin ? 'final' : 'result');
  }

  Object.assign(M.actions, {
    fight: () => { newBattle(state.realm); M.go('battle'); },
    quitBattle: () => { state.battle = null; M.go('map'); },
    chooseSpell: arg => chooseSpell(Number(arg)),
    key: arg => press(arg),
    choose: arg => choose(Number(arg)),
    cast: () => cast(),
    next: () => next(),
    hint: () => {
      const b = state.battle;
      if (!b || b.phase !== 'puzzle' || b.hintUsed || has('gusty')) return;
      b.hintUsed = true; b.hints++;
      refreshPanel(false);
    },
    itemInfo: arg => {
      const b = state.battle;
      if (!b) return;
      b.info = arg && b.info !== arg ? arg : null;
      refreshKit();
    },
    useItem: arg => useItem(arg),
    retry: () => retry(),
    swap: () => swap()
  });

  document.addEventListener('keydown', e => {
    const b = state.battle;
    if (state.screen !== 'battle' || !b || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (b.phase === 'puzzle') {
      const p = b.puzzle;
      if (p.input === 'number') {
        if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(e.key); }
        else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); press('del'); }
        else if (e.key === 'Enter') { e.preventDefault(); cast(); }
      } else {
        const n = Number(e.key);
        if (n >= 1 && n <= p.choices.length) { e.preventDefault(); choose(p.choices[n - 1].id); }
        else if (e.key === 'Enter') { e.preventDefault(); if (b.choice !== null) cast(); }
      }
    } else if (b.phase === 'spell' && /^[1-3]$/.test(e.key)) {
      e.preventDefault(); chooseSpell(Number(e.key) - 1);
    } else if (b.phase === 'feedback' && e.key === 'Enter') {
      e.preventDefault(); next();
    }
  });

  // Small hook for automated play-testing
  window.__mim = { state, cast, press, choose, chooseSpell, next, useItem, retry, swap };
  M.boot();
})();

</script>
</body>
</html>
